# 要塞對戰 — 突發事件
#
# 網頁版是「每回合開始抽一次」，MC 版沒有回合，改成每隔 duel.yml 的
# incident.interval_seconds 抽一次。權重比例照抄網頁版（純給錢的三個各 15%、其餘各 5%）。
#
# 欄位
#   name              顯示名稱
#   description       公告時附的一行說明
#   weight            抽籤權重
#   action            效果種類：
#                       message     只公告，沒有其他效果
#                       spawn_mobs  在場中央生成 mobs 列出的怪
#                       raid        在**雙方各自的熊貓圈旁邊**放一批怪（家裡的麻煩）
#                       meteor      在雙方的熊貓圈上方落下一批已點燃的 TNT
#                       modifier    有時限的全域修正（重力／武器傷害／方塊受到的傷害）
#   modifier            action = modifier 時要改什麼：gravity / weapon_damage / block_damage
#   factor              倍率。0.5 = 減半，1.5 = 增加五成
#   duration_seconds    修正持續幾秒
#   mobs              action = spawn_mobs 時要生成哪幾種（對應 mobs.yml 的 id）
#   meteor_count      action = meteor 時，每一方的頭上各落幾顆
#   meteor_height     從熊貓圈上方幾格落下
#   meteor_spread     以熊貓圈為中心，落點散佈幾格
#   meteor_fuse_ticks 引信長度。太短會在半空中就炸掉，太長會落地後躺一陣子才爆
#   meteor_fuse_jitter 引信的隨機浮動。0 = 全部同時爆（一聲巨響，不是一陣雨）
#   music             發生時播放的音樂／音效 id，省略 = 不播
#                     走 MUSIC 頻道（玩家的「音樂」音量滑桿管得到），在雙方各自的位置各播一次，
#                     所以離得再遠也聽得到自己這場的事件音樂
#   music_volume      音量倍率，預設 1.0
#   music_pitch       音高倍率，預設 1.0（0.5 = 低一個八度，聽起來更沉）
#
# action: message 是「只公告、沒有效果」。現在沒有事件在用它——留著是因為做新事件的時候
# 先寫 message 版本、確認公告與音效的感覺對了再接效果，是個方便的中間狀態。
#
# 想放自己的音樂：把 ogg 放進資源包的 assets/<namespace>/sounds/，在 sounds.json 註冊一個
# 事件名，這裡就填那個 id。原版可用的例如：
#   minecraft:entity.wither.spawn        沉重的警告
#   minecraft:entity.ender_dragon.growl  低吼
#   minecraft:event.raid.horn            襲擊號角
#   minecraft:block.beacon.activate      上升音

incidents:
  dungeon:
    name: 隱藏副本
    description: 中場湧出一群雜七雜八的野獸，先搶先贏。
    weight: 15
    action: spawn_mobs
    mobs: [swarm]
    music: minecraft:entity.polar_bear.ambient

  ground_horde:
    name: 土偶大軍
    description: 中場一字排開一批土偶，血厚但走得慢。
    weight: 15
    action: spawn_mobs
    mobs: [ground]
    music: minecraft:entity.zombie.ambient
    music_pitch: 0.6

  drift_horde:
    name: 漂鳥群
    description: 漂鳥飄進中場，飛得又高又飄很難瞄。
    weight: 15
    action: spawn_mobs
    mobs: [drift]
    music: minecraft:entity.bee.loop_aggressive

  refugee_raid:
    name: 難民來襲！
    description: 一支武裝小隊降落到中場，之後會朝隨機目標開火。
    weight: 5
    action: spawn_mobs
    mobs: [refugee]
    music: minecraft:event.raid.horn

  eclipse:
    name: 蝕世之影
    description: 它對人沒興趣，但對人造物有無法抑制的破壞慾。
    weight: 5
    action: spawn_mobs
    mobs: [eclipse]
    music: minecraft:entity.ender_dragon.growl
    music_pitch: 0.7

  ender:
    name: 終界怪物降臨
    description: 它會獵食場上的小怪，吃越多長越大。
    weight: 5
    action: spawn_mobs
    mobs: [boss]
    music: minecraft:entity.wither.spawn

  # 天災：不站在任何一邊，兩個要塞一起挨轟。所以它改變的是雙方的防禦狀態，
  # 而不是誰領先——這也是為什麼它打的是雙方的熊貓圈，不是中場。
  #
  # 炸不到熊貓：TNT 沒有 owner，而熊貓只吃對手玩家的攻擊。天災拆的是你的牆，
  # 不該直接決定勝負。
  #
  # 黑曜石的爆炸抗性擋得住 TNT、石頭擋不住，所以「花錢蓋好料」在天災面前真的有差。
  meteor:
    name: 隕石雨
    description: 隕石襲擊雙方要塞，找掩護！
    weight: 5
    action: meteor
    meteor_count: 10
    meteor_height: 26
    meteor_spread: 8
    meteor_fuse_ticks: 45
    meteor_fuse_jitter: 25
    music: minecraft:entity.generic.explode
    music_pitch: 0.5

  # ---- 有時限的全域修正（action: modifier）----
  #
  # modifier 指定改什麼、factor 是倍率、duration_seconds 是持續多久：
  #
  #   gravity        彈丸重力        開火那一刻決定
  #   weapon_damage  武器傷害        開火那一刻決定
  #   block_damage   方塊受到的傷害   **命中那一刻**決定
  #
  # 前兩個寫進彈丸、最後一個在命中時才查，這個分界是刻意的：前兩個是「這一發打得多用力」，
  # 屬於子彈；最後一個是「這面牆多耐打」，屬於牆。效果在彈丸飛到一半時結束的話，這樣才
  # 不會出現「射出去的東西忽然改變物理」那種看起來像 bug 的畫面。
  #
  # 60 秒是照攻擊階段的長度設的。事件每 120 秒抽一次而且不管當下是哪個階段，所以這個長度
  # 保證它至少涵蓋一段攻擊階段的一部分——完全落在建造階段的話前半段確實會浪費掉。
  #
  # 同一種修正再抽到一次是整個換掉、不是相乘：兩次低重力疊成 0.25 倍重力沒有人預期得到

  low_gravity:
    name: 低重力
    description: 這段時間重力減半，彈道又高又遠。
    weight: 5
    action: modifier
    modifier: gravity
    factor: 0.5
    duration_seconds: 60
    music: minecraft:block.beacon.activate
    music_pitch: 1.4

  fortify:
    name: 銅牆鐵壁
    description: 這段時間所有方塊受到的傷害減半。
    weight: 5
    action: modifier
    modifier: block_damage
    factor: 0.5
    duration_seconds: 60
    music: minecraft:block.anvil_use
    music_pitch: 0.7

  rampage:
    name: 火力全開
    description: 這段時間所有武器傷害 ×1.5。
    weight: 5
    action: modifier
    modifier: weapon_damage
    factor: 1.5
    duration_seconds: 60
    music: minecraft:entity.blaze.shoot
    music_pitch: 0.8

  # ---- 家裡的麻煩（action: raid）----
  #
  # 跟 spawn_mobs 的差別只有落點，而落點就是這個事件的全部意義：中場的怪是雙方要搶的
  # **收入**，生在自己熊貓圈旁邊的怪是你自己要處理的**麻煩**。兩邊同時放，所以起點對稱。
  #
  # duel.yml 的 arena.creatures_roam_freely 開著時牠們不會被鎖在生成的那一側，會追著人跑，
  # 所以真的會有幾隻晃到對面去。那是可以接受的浮動——牠們追的是最近的玩家，多數還是留在原地。
  #
  # 蠹蟲是 mobs.yml 裡唯一敵對的一種：牠一生出來就往人走。中場那些是被動或中立的，要你先
  # 動手才會理你；這裡要的效果剛好相反，就是要逼你放下手上的工事回頭處理
  plague:
    name: 鼠疫
    description: 蠹蟲從地底湧上來，兩邊的陣地都遭殃。
    weight: 5
    action: raid
    mobs: [vermin]
    music: minecraft:entity.silverfish.hurt
    music_pitch: 0.8
