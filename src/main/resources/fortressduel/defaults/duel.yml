# 要塞對戰 — 對戰本身的設定
# 怪物、武器、突發事件各自在 mobs.yml / weapons.yml / incidents.yml。
# 改完用 /duel reload 重讀（進行中的那場會沿用它開場時的設定）。

challenge:
  # 挑戰書多久沒人回應就作廢（秒）
  timeout_seconds: 30
  # 發起挑戰時雙方最遠可以差幾格
  max_distance: 100

arena:
  # 框出來的正方形最小邊長（格）。實際邊長會取「兩人的最大軸距 + 兩側 margin」與這個值
  # 之中較大的那個——場地是就地框在雙方之間的，站得越開場地越大
  size: 48
  # 範圍往上算幾格（框線的高度上限也吃這個值）
  height: 32
  # 範圍往下算幾格（要挖地道的話調大）
  depth: 8
  # 邊界離最外側的玩家至少留幾格
  margin: 16
  # 熊貓圈圍在玩家往「遠離對手」方向退幾格的位置。圍在腳下會把人卡住，
  # 而且熊貓貼著自己的臉也不好守
  core_offset: 3
  # 新的一場不能開在別場競技場的這個距離之內
  min_separation: 24
  # 框線用什麼方塊。barrier 看不見也打不掉；想要看得見可以改成 minecraft:glass
  border_block: minecraft:barrier
  border_height: 32
  # true  = 打完把整個範圍還原成開場前的樣子（同一塊地可以重複開場）
  # false = 只還原這個 mod 自己放的東西（框線與柵欄圈），玩家挖的洞留著
  # 兩種模式下熊貓都會被明確移除——牠們是實體，還原只處理方塊
  restore_terrain: true
  # 開場時兩側各蓋哪幾棟建築（對應 buildings.yml）
  buildings:
    - weapon_shop

# 要保護的目標。取代舊的烽火台核心——目標是實體而不是方塊，所以可以用牽繩拉走、
# 藏進地下室或假房間，「打哪裡」本身就成了攻方要解的問題。
objective:
  # 目標生物。換成別種只要改這裡（村民、鐵傀儡都可以），不用改 Java
  entity: minecraft:panda
  # 每一方要守幾隻。全部死光那一方就輸
  panda_count: 4
  # 每隻的血量。原版熊貓只有 20，不上調的話狙擊(52)、無人機(70) 一發一隻。
  # 預設 4 × 100 = 400，總量跟舊的水晶一樣，整體節奏不變
  panda_hp: 100
  # 開場柵欄圈的半徑。2 = 5×5 的圈（柵欄疊兩格高，不然熊貓被推一下就跳出去）
  pen_radius: 2
  pen_block: minecraft:oak_fence
  # 熊貓周圍 3×3×3（共 27 格）裡至少要有幾格站得進去，低於這個值就持續掉血。
  # 沒有這條規則的話最優解固定是「封進 1×1 黑曜石棺材」，佈局的博弈就不存在了。
  # 參考值：空曠地面約 18 格，1×1 棺材只有 1~2 格
  suffocation_min_space: 6
  # 空間不足時每秒扣多少血
  suffocation_damage: 2.0

battle:
  # 準備階段長度（秒）。這段時間玩家可以走到想要的位置——時間一到，熊貓圈就在
  # 你**當下站的地方**旁邊圍起來。開場不傳送任何人，所以這十秒是你選陣地的機會
  countdown_seconds: 10
  # 建造階段長度（秒）：可以擺方塊，不能攻擊
  build_seconds: 60
  # 攻擊階段長度（秒）：不能擺方塊，可以攻擊
  combat_seconds: 60
  out_of_bounds_grace_ticks: 40
  # 開場發給雙方的物資。格式：「物品 id 數量」，數量省略 = 1
  # 建材要自己挖是規則的一部分，這只是讓第一個建造階段有東西可以蓋。
  # 牽繩是熊貓的移動手段：沒有它就只能守在開場那個柵欄圈，佈局的選擇等於沒有
  starting_items:
    - minecraft:dirt 20
    - minecraft:lead 4

incident:
  # 每隔幾秒抽一次突發事件。設成一輪的長度（build_seconds + combat_seconds）
  # 對齊網頁版的「每回合抽一次」。
  #
  # 這個值直接決定經濟的傾斜程度：怪物賞金是「贏者全拿」的收入，抽得越頻繁，
  # 瞄得準的一方領先得越快。設 60（每輪兩次）時，場上的怪物金約是單人固定收入的
  # 2.1 倍，網頁版特地改版把這個比例壓到 1.06 倍——調小之前先想清楚。
  interval_seconds: 120

economy:
  # 開局資金
  starting_money: 600
  # 每一輪建造階段開始時雙方各拿多少（保證落後方也有基本盤，不會被賞金滾雪球輾死）
  round_income: 380

weapon:
  # 方塊血量 = 原版硬度 × 這個係數。原版硬度參考：泥土 0.5、木頭 2、石頭 1.5、黑曜石 50
  # 調大 = 牆更耐打、攻防節奏變慢；調小 = 一發破一片
  block_hp_per_hardness: 10.0
