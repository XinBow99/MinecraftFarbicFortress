# 要塞對戰 — 對戰本身的設定
# 怪物、武器、突發事件各自在 mobs.yml / weapons.yml / incidents.yml。
# 改完用 /duel reload 重讀（進行中的那場會沿用它開場時的設定）。

challenge:
  # 挑戰書多久沒人回應就作廢（秒）
  timeout_seconds: 30
  # 發起挑戰時雙方最遠可以差幾格
  max_distance: 100

arena:
  # 框出來的正方形邊長（格）
  size: 48
  # 範圍往上算幾格（框線的高度上限也吃這個值）
  height: 32
  # 範圍往下算幾格（要挖地道的話調大）
  depth: 8
  # 找場地時最遠找到幾格外
  search_radius: 200
  # 競技場之間、以及競技場與挑戰者之間至少隔幾格
  min_separation: 24
  # 框線用什麼方塊。barrier 看不見也打不掉；想要看得見可以改成 minecraft:glass
  border_block: minecraft:barrier
  border_height: 32
  # true  = 打完把整個範圍還原成開場前的樣子（同一塊地可以重複開場）
  # false = 只還原這個 mod 自己放的東西（框線與核心底座），玩家挖的洞留著
  restore_terrain: true
  # 開場時兩側各蓋哪幾棟建築（對應 buildings.yml）
  buildings:
    - weapon_shop

core:
  # 烽火台核心的血量。網頁版是 400
  hp: 400
  # 左鍵打一下敵方核心扣多少血（骨架階段的暫定手段，之後由武器決定）
  hit_damage: 10
  # 核心底座的方塊
  base_block: minecraft:iron_block

battle:
  # 進場後倒數幾秒才開始第一輪
  countdown_seconds: 5
  # 建造階段長度（秒）：可以擺方塊，不能攻擊
  build_seconds: 60
  # 攻擊階段長度（秒）：不能擺方塊，可以攻擊
  combat_seconds: 60
  out_of_bounds_grace_ticks: 40
  # 開場發給雙方的物資。格式：「物品 id 數量」，數量省略 = 1
  # 建材要自己挖是規則的一部分，這只是讓第一個建造階段有東西可以蓋
  starting_items:
    - minecraft:dirt 20

incident:
  # 每隔幾秒抽一次突發事件。網頁版是每回合抽一次，一回合大約一分鐘
  interval_seconds: 60

economy:
  # 開局資金
  starting_money: 600
  # 每一輪建造階段開始時雙方各拿多少（保證落後方也有基本盤，不會被賞金滾雪球輾死）
  round_income: 380

weapon:
  # 方塊血量 = 原版硬度 × 這個係數。原版硬度參考：泥土 0.5、木頭 2、石頭 1.5、黑曜石 50
  # 調大 = 牆更耐打、攻防節奏變慢；調小 = 一發破一片
  block_hp_per_hardness: 10.0
