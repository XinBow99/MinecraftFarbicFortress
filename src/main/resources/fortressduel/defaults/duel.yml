# 要塞對戰 — 對戰本身的設定
# 怪物、武器、突發事件各自在 mobs.yml / weapons.yml / incidents.yml。
# 改完用 /duel reload 重讀（進行中的那場會沿用它開場時的設定）。

challenge:
  # 挑戰書多久沒人回應就作廢（秒）
  timeout_seconds: 30
  # 發起挑戰時雙方最遠可以差幾格
  max_distance: 100

arena:
  # 框出來的正方形最小邊長（格）。實際邊長會取「兩人的最大軸距 + 兩側 margin」與這個值
  # 之中較大的那個——場地是就地框在雙方之間的，站得越開場地越大
  size: 48
  # 範圍往上算幾格（框線的高度上限也吃這個值）。往天空給得比往地底寬——蓋高塔、架砲台
  # 是正常打法，往地底挖只是躲，給太多會變成雙方挖到地底誰也打不到誰
  height: 32
  # 範圍往下算幾格（要挖地道的話調大）
  depth: 8
  # 中場佔兩座熊貓圈距離的比例。0.3 = 中間 30% 是中場，兩邊各 35% 是自己的半場。
  #
  # 場地沿著兩座圈的連線分成三塊：A 的半場、中場、B 的半場。玩家關在自己的半場、
  # 熊貓關在主人的半場——這是「只靠遠程決勝」的實作，衝進對方陣地拆牆或貼臉砍熊貓
  # 都不是選項。上下也一樣關，吃的是上面的 height/depth。
  #
  # 用比例而不是固定格數：玩家可能站得很近，固定 16 格的中場在那種局面會把整個場地吃掉
  neutral_fraction: 0.3

  # 怪物可不可以走出中場、跑進玩家的陣地。
  #
  # true  = 只限制「不能離開競技場」，區塊分界對牠們不生效。怪會自己送上門（中立生物被打
  #         之後真的追得到你），事件放進陣地裡的蠹蟲也可能跑到對面去。場面比較活。
  # false = 關回中場，也就是三區塊限制原本的樣子。
  #
  # 代價：怪可能晃到某一方的陣地裡被安全清掉，賞金因此帶一點運氣成分。覺得太隨機就關掉。
  #
  # **玩家與熊貓不受這個設定影響**，永遠關在自己那半場——那是三區塊限制真正要解的問題，
  # 怪物待在哪裡只是附帶的
  creatures_roam_freely: true
  # 邊界離最外側的玩家至少留幾格
  margin: 16
  # 熊貓圈圍在玩家往「遠離對手」方向退幾格的位置。圍在腳下會把人卡住，
  # 而且熊貓貼著自己的臉也不好守
  core_offset: 3
  # 新的一場不能開在別場競技場的這個距離之內
  min_separation: 24
  # 框線用什麼方塊、圍多高。
  #
  # **這圈牆是標示，不是圍欄。** 真正把人跟東西關在場內的全部在程式裡：
  #   玩家走出去   Duel.keepInside 每 tick 拉回來
  #   生物         Duel.confineToArena 每 5 tick 夾回來
  #   彈丸         WeaponSystem.step 一飛出範圍就消失
  #   挖框線／打框線／在場外放方塊   三個事件處理各自否決
  # 所以牆破了一個洞也沒有人跑得出去，它的工作只是讓玩家看得到邊界在哪。
  #
  # 用 barrier 是最糟的選擇：它**看不見**，所以那個唯一的工作它做不到，反而製造出
  # 「這裡有一道打不穿的空氣牆」這種完全無法理解的體驗（子彈會莫名其妙停在半空中）。
  # 而且它在生存模式拆不掉，殘留在世界上時只能靠 /duel cleanup 清。
  #
  # 玻璃看得見、擋得住、透得過去（還看得到外面的世界，不會有被關起來的壓迫感）。
  # 用透明的而不是染色的：染色玻璃遠遠比較醒目，但整個盒子都染色會讓場內的視野帶一層顏色，
  # 而這遊戲要一直往外瞄。想要邊界更明顯就換成 minecraft:red_stained_glass 之類的。
  #
  # border_cap_block 設了就是一個**封閉的盒子**：天花板、地板都鋪滿，四面牆也跟著長到
  # 盒底與盒頂，玩家往上爬或往下挖都會撞到同一個殼。留空 = 只有一圈牆（舊行為）。
  #
  # 外殼**任何方式都破壞不了**：挖不掉（DuelManager.allowBreak）、武器打不掉
  # （WeaponSystem.damageBlock）、炸不掉（ExplosionMixin 把外殼從爆炸的清單裡濾掉）。
  # 最後那條是必要的——高爆彈的彈藥物品就是 TNT，不擋的話玩家可以放在牆邊點掉
  border_block: minecraft:glass
  border_cap_block: minecraft:glass
  # 只在 border_cap_block 留空（不封頂）時決定牆多高。封起來的話牆一律長滿整個盒子
  border_height: 12
  # true  = 打完把整個範圍還原成開場前的樣子（同一塊地可以重複開場）
  # false = 只還原這個 mod 自己放的東西（框線與柵欄圈），玩家挖的洞留著
  # 兩種模式下熊貓都會被明確移除——牠們是實體，還原只處理方塊
  restore_terrain: true
  # 開場時兩側各蓋哪幾棟建築（對應 buildings.yml）。
  #
  # 預設是空的：開場刻意極簡——一片木製平台，上面站著玩家、軍火商、和柵欄圍住的熊貓，
  # 沒有別的。這個遊戲的內容應該由玩家在建造階段長出來，開場先擺一棟蓋好的房子只會佔掉
  # 那個空間。想要武器商店那棟房子回來就填 weapon_shop（藍圖仍在 buildings.yml 裡）
  buildings: []

  # 熊貓圈外再往外幾格的木製平台。0 = 不鋪，沿用原本的地形。
  #
  # 鋪平台不只是為了好看：地形起伏會讓「誰站得比較高」變成開場就決定的隨機優勢，
  # 而雙方的位置是自己走出來的、不是系統挑的，所以那個優勢沒有人為它負責
  platform_radius: 5
  platform_block: minecraft:oak_planks
  # 開場放在平台上的商人（對應 npcs.yml）。留空 = 不放。
  # 他打得死——一倒那一側就補不到子彈，所以「先做掉對方的商人」是一條有效的戰術
  dealer_npc: arms_dealer

# 要保護的目標。取代舊的烽火台核心——目標是實體而不是方塊，所以可以拿竹子引走、
# 藏進地下室或假房間，「打哪裡」本身就成了攻方要解的問題。
objective:
  # 目標生物。換成別種只要改這裡（村民、鐵傀儡都可以），不用改 Java
  entity: minecraft:panda
  # 每一方要守幾隻。全部死光那一方就輸
  panda_count: 4
  # 每隻的血量。原版熊貓只有 20，不上調的話狙擊(52)、無人機(70) 一發一隻。
  # 預設 4 × 100 = 400，總量跟舊的水晶一樣，整體節奏不變
  panda_hp: 100

  # 每隻的個性，照順序對到第 1、2、3… 隻（不夠就從頭循環）。
  #
  # 原版是隨機抽的，而個性直接決定牠好不好引：
  #   normal      正常，拿竹子就跟著走
  #   lazy        懶惰，常常躺著不動
  #   worried     膽小，會**主動躲開玩家**——拿竹子牠反而跑
  #   aggressive  暴躁，會反過來打你
  #   playful / brown / weak  外觀或次要行為差異
  #
  # 所以不能讓它隨機：一方拿到三隻正常、另一方三隻膽小，是純運氣造成的優劣勢，
  # 跟這個遊戲想比的東西無關。
  #
  # 預設三正常一懶惰而不是四隻全正常：四隻一模一樣會擠成一團動作一致，看起來像複製品。
  # 懶惰的只是不太走動，不會像 worried 那樣躲你，牽起來仍然可預期
  personalities:
    - normal
    - normal
    - normal
    - lazy

  # 開場柵欄圈的半徑。2 = 5×5 的圈（柵欄疊兩格高，不然熊貓被推一下就跳出去）
  pen_radius: 2
  pen_block: minecraft:oak_fence
  # 熊貓周圍 3×3×3（共 27 格）裡至少要有幾格站得進去，低於這個值就持續掉血。
  # 沒有這條規則的話最優解固定是「封進 1×1 黑曜石棺材」，佈局的博弈就不存在了。
  # 參考值：空曠地面約 18 格，1×1 棺材只有 1~2 格
  suffocation_min_space: 6
  # 空間不足時每秒扣多少血
  suffocation_damage: 2.0

battle:
  # 準備階段長度（秒）。這段時間玩家可以走到想要的位置——時間一到，熊貓圈就在
  # 你**當下站的地方**旁邊圍起來。開場不傳送任何人，所以這十秒是你選陣地的機會
  countdown_seconds: 10
  # 建造階段等雙方 /duel ready 才開戰，而不是倒數固定秒數。
  #
  # 蓋一座守得住的房子要多久，取決於你想蓋什麼——固定秒數等於逼所有人蓋同一種規模的東西，
  # 而那正是這個遊戲想讓玩家自己決定的部分。攻擊階段仍然計時：節奏要有來源。
  build_until_ready: true
  # ready 模式下最多等幾秒，時間到就強制開戰。0 = 不限。
  # 純粹是掛機的保險——離線會直接判負，但掛在原地不按 ready 的話這一場會永遠停住
  build_timeout_seconds: 300
  # 建造階段長度（秒）：可以擺方塊，不能攻擊。只在 build_until_ready: false 時有意義
  build_seconds: 60
  # 攻擊階段長度（秒）：不能擺方塊，可以攻擊
  combat_seconds: 60
  out_of_bounds_grace_ticks: 40
  # 開場把玩家切成這個模式，結束還原成他原本的。
  #
  # 這是防呆不是防弊：對戰中自己 /gamemode creative 不會被改回來，因為持續強制會讓
  # 開發時沒辦法隨時切模式測試。作弊該用權限管，不是用遊戲規則管。
  #
  # 不要設成 adventure：它挖不了方塊，而本作的前提是「建材自己挖、自己蓋」
  gamemode: survival

  # 開場把玩家原本的背包整份寄放起來，結束原封不動還他（含副手與盔甲欄）。
  #
  # 為什麼要清：玩家是帶著自己在主世界的家當就地進場的（開場不傳送人），身上本來就有
  # 一套鑽石裝、一堆黑曜石、一把附魔弓的人，跟剛上線的人打的不是同一場遊戲。雙方的差距
  # 應該由同一份開場物資與同一個經濟系統長出來。
  #
  # 寄放的東西寫在存檔資料夾的 fortress-duel-stash/<uuid>.dat，不是放在記憶體——中途登出、
  # 伺服器關掉、伺服器當掉，這三種情況都只是「下次上線才還」，而不是把人的家當洗掉。
  #
  # 設成 false 給開發用：每次測試都被收走測試道具很難做事
  clear_inventory: true

  # 開場發給雙方的物資。格式：「物品 id 數量」，數量省略 = 1
  #
  # 對戰中場內挖到的方塊**一律不掉落**（見 DuelManager.onBlockBreak），所以建材只有一個
  # 來源：跟軍火商買。挖得到的話一片山壁就有幾百塊石頭，商店的定價與「每元買到多少血量」
  # 那套比較全部失去意義。這裡發的是讓第一個建造階段不至於完全空手的量。
  # 竹子是熊貓的移動手段：沒有它熊貓就只能待在開場那個柵欄圈，佈局的選擇等於沒有。
  #
  # 不能用牽繩——原版的 Panda.canBeLeashed() 寫死回 false，牽繩對熊貓右鍵完全沒反應。
  # 熊貓吃的是 #minecraft:panda_food，而那個標籤裡**只有竹子**：手上拿著竹子牠就會跟過來
  # （原版的 TemptGoal），這也正是「引誘」這個設計本來想要的操作。
  #
  # 拿在手上跟著走就好，不要對熊貓右鍵——右鍵是餵食，兩隻都餵會進入繁殖狀態生出小熊貓，
  # 而小熊貓不是你要守的那四隻（牠死了不算數，但會讓場面更難分辨誰是誰）
  #
  # 弓是全場通用的發射器，副手放什麼彈藥就射什麼——所以每人只需要一把，商店也不賣
  #
  # 清空背包之後這份清單就是玩家的全部家當，所以工具也得發：一把鎬子。斧頭、鏟子、
  # 更好的鎬子在軍火商那裡賣——第一輪就要決定「先買工具還是先買彈藥」，那是個真的選擇
  starting_items:
    - minecraft:bow
    - minecraft:stone_pickaxe
    - minecraft:dirt 20
    - minecraft:bamboo 16

incident:
  # 每隔幾秒抽一次突發事件。設成一輪的長度（build_seconds + combat_seconds）
  # 對齊網頁版的「每回合抽一次」。
  #
  # 這個值直接決定經濟的傾斜程度：怪物賞金是「贏者全拿」的收入，抽得越頻繁，
  # 瞄得準的一方領先得越快。設 60（每輪兩次）時，場上的怪物金約是單人固定收入的
  # 2.1 倍，網頁版特地改版把這個比例壓到 1.06 倍——調小之前先想清楚。
  interval_seconds: 120

economy:
  # 開局資金
  starting_money: 600
  # 每一輪建造階段開始時雙方各拿多少（保證落後方也有基本盤，不會被賞金滾雪球輾死）
  round_income: 380
  # 被對手打中時，每一點傷害扣多少錢。0 = 關掉
  #
  # 這是「擊殺玩家 = 獲勝」的替代方案。直接判勝負的話，狙擊 52、導彈 180 對上只有 20 血的
  # 玩家，等於先命中的人贏，前面的建造、經濟、佈局全部失去意義。改成扣錢之後，打中人仍然
  # 是一筆實質收穫（對手少了一輪的補給），但不會一發終結整場。
  #
  # 單次罰款以滿血量為上限，所以一發最多扣 20 × 2 = $40。
  # 只算對手造成的傷害——摔落、岩漿、怪物不算，那些不是對手的操作
  #
  # 為什麼從 5 降到 2：5 的時候一發 $1 的廢鐵彈（20 傷害，剛好打滿上限）讓對手損失 $100，
  # 報酬率 100 倍——比拆牆高兩個數量級，最優解變成「拿最便宜的彈去點人」而不是攻堅。
  # 降到 2 之後同一發換到 $40，跟拆一格黑曜石（$25~50）落在同一個量級，兩條路才有得比
  damage_penalty: 2

weapon:
  # 方塊血量 = 原版硬度 × 這個係數。原版硬度參考：泥土 0.5、木頭 2、石頭 1.5、黑曜石 50
  # 調大 = 牆更耐打、攻防節奏變慢；調小 = 一發破一片
  block_hp_per_hardness: 10.0

  # 特定方塊的血量直接寫死，蓋過上面那條公式。
  #
  # 需要它是因為**原版硬度量的是「挖多久」，不是「多耐打」**。大部分時候兩者方向一致，
  # 但橡木板的硬度 2.0 比石頭的 1.5 高——照公式算木牆會比石牆耐打，沒有人會這樣預期，
  # 而建材的取捨正是靠這種直覺在做的。
  #
  # 只覆寫對不上的那一個。其餘全部走公式，這樣調 block_hp_per_hardness 時整個世界
  # （包含玩家挖出來的地形）仍然是一致的
  block_hp:
    minecraft:oak_planks: 10
