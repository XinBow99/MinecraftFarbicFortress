# 要塞對戰 — 曲目
#
# 音樂家（npcs.yml 的 musician）櫃子上的每一格就是這裡的一首歌，賣的是**一張光碟**：
# 右鍵他開店、點一格買下來，拿在手上右鍵才播放，**場上兩邊都聽得到**。
#
# 光碟還有第二個用途：**把它跟材料一起放進工作台**，做出來的彈藥開火時就會放那首歌。
# 可以疊（最多三首，見 CraftingBench.MAX_SONGS）。**合成會把光碟吃掉**——右鍵播放不會用掉，
# 但合進彈藥是另一回事：那份設計會永久帶著這首歌，量產出來的每一發都帶著。再拿一張是免費的。
# 開火放的是**截短版**：固定 2 秒，而且播完之前再開槍不會重新觸發，所以連射時聽到的是
# 一首連續播下去的歌，不是每一發都從頭卡一下（見 WeaponSystem.FIRE_SOUND_TICKS）。
#
# 光碟買斷：不會用掉、放完可以再放，對戰結束也不收回（其他買來的東西都會收）。
# 所以「什麼時候放」變成玩家自己的決定——衝進對面院子的那一刻按下去，跟站在商店前面點一首，
# 是兩件事。放完之前再按沒有作用，不擋的話連按會疊出好幾軌同一首歌。
#
# ---------------------------------------------------------------------------
# 加一首歌要做的事（就兩步）
#
#   1. 把音檔轉成 OGG Vorbis，丟進 src/main/resources/assets/fortress-duel/sounds/
#      檔名就是它的 id：只能用小寫英數與底線（wow.ogg → id 是 wow）
#
#        ffmpeg -i 你的歌.mp3 -c:a libvorbis -q:a 4 -ar 44100 wow.ogg
#
#   2. 在下面加三行：id、name、length
#
# sounds.json 不用碰——建置時會掃那個資料夾自動產生。
# 之後跑 ./gradlew resourcePack 重打資源包、把新的網址與 sha1 填回 server.properties
# （見 README 的「伺服器資源包」）。伺服器端只要 /duel reload 就會看到新歌。
# ---------------------------------------------------------------------------
#
# 欄位
#   name    櫃子上顯示的名字
#   length  這首歌多長（秒）。放完之前再按沒有作用——不擋的話連按會疊出好幾軌同一首歌。
#           **寧可寫長不要寫短**：寫短了下一次按會蓋在還沒放完的尾巴上。
#           （只管右鍵播放。合進彈藥的那條路不看這個欄位，它一律只放 2 秒）
#   sound   音效 id。省略 = fortress-duel:<這首歌的 id>，所以照上面的檔名規則就不用寫
#   item    光碟長什麼樣子（櫃子上的圖示也是它）。省略 = 照順序發一張原版唱片
#   price   要收錢的話填這裡。省略 = 免費
#   lore    說明文字
#
# 為什麼免費：放歌不影響勝負，它是給人玩的。收錢的話它就得跟彈藥、建材、工人競爭，
# 而那個比較的結論永遠是「別買光碟」——那等於這個功能不存在

title: 音樂家

songs:
  chinese:
    name: 中式警報
    length: 8
    lore: 快跑

  xue_hua_piao_piao:
    name: 雪花飄飄
    length: 9
    lore: 北風蕭蕭

  hachimi:
    name: 哈基米
    length: 25

  # 完整版有 3 分 24 秒，這裡只收前 30 秒。理由不是檔案大小，是**它會把櫃子鎖住**——
  # 一首歌沒放完就點不了下一首，三分半的歌等於音樂家整場只能用一次
  indian_music:
    name: 印度神曲
    length: 30
    lore: 只有前 30 秒

  wow:
    name: Wow
    length: 5
