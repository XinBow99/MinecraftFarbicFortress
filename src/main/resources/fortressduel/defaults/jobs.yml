# 要塞對戰 — 工人經濟（礦工與農夫）
#
# 花錢從軍火商那裡雇工人，他們自己走到場上的礦脈與稻田工作，替你賺錢。
#
# 這是繼怪物賞金之後第二條要冒風險的收入，但成本的形式完全不同：
#   賞金   付子彈、要瞄準、當下兌現，在中場跟對手搶
#   工人   付一筆本金、不用操作、要好幾輪才回本，代價是**它會被打掉**
#
# 所以它服務的是不同的玩家跟不同的局面：不擅長開槍的人也有一條經濟路線可以走，
# 而領先的一方多了一個「打勝負還是打經濟」的選擇——在這之前全場只有熊貓一個目標。
#
# 工人本身是一個沒有商店的 NPC（殼、血量、名字在 npcs.yml），節點是一張建築藍圖
# （形狀、材質在 buildings.yml）。所以加一種新職業、換一種礦、把稻田改成 5×5，
# 全部只要改設定檔。


# ---- 職業 ----
#
#   name        顯示名稱
#   npc         用 npcs.yml 的哪一個 NPC 當殼
#   node        去採哪一種節點（對應下面的 nodes:）
#   income      每採收一格進帳多少
#   work_ticks  站到節點旁邊之後，要站多久才收成一次（20 tick = 1 秒）
#
# 產出速率 = income / work_ticks。調 work_ticks 比調 income 直覺——玩家看得到工人在動，
# 慢一點就是慢一點；而 income 只是一個看不見的數字。
#
# 下面的數字是這樣算出來的，要改的話照同一條路重算：
#   一輪大約 90 秒（攻擊 60 秒 + 停火階段雙方蓋牆的時間）＝ 1800 tick
#   工人不會一直在採——要走路、要換節點，實際大概只有六成的時間在工作
#
#   農夫  $25 / 200 tick  →  滿載 $150/分  →  實際約 $135/輪
#   礦工  $45 / 240 tick  →  滿載 $225/分  →  實際約 $200/輪
#
# 對照每一輪的固定收入 $380，一個工人大約是它的三到五成。價格在 shops.yml，
# 回本壓在 2~3 輪——比一場對戰短，但長到「這筆錢買工人還是買彈藥」是真的要選一個。
jobs:
  miner:
    name: §8礦工
    npc: miner
    node: ore
    income: 45
    work_ticks: 240

  farmer:
    name: §a農夫
    npc: farmer
    node: rice
    income: 25
    work_ticks: 200


# ---- 節點 ----
#
#   name          顯示名稱（商店的說明文字會用「他會自己走去○○工作」）
#   building      用 buildings.yml 的哪一張藍圖擺出來
#   harvestable   哪些方塊算「可以採的」
#   per_round     每一輪停火階段開始時，替每一方補幾個
#   max           每一方場上最多同時幾個
#   min_distance  離自己的熊貓圈至少幾格
#   max_distance  離自己的熊貓圈最多幾格
#
# harvestable 同時是**枯竭判定的依據**：每次工作前重數一次節點裡還剩幾格屬於這一組，
# 歸零就代表這個節點結束了。所以「農夫慢慢收割光」跟「對手一發高爆彈轟平」是同一條路徑，
# 不需要各寫一套規則。也因此藍圖裡的裝飾（水源、耕地、石頭底座）不該列進來——
# 那些被打掉不算損失。
#
# 為什麼 max 只有 2：**讓節點供給剛好卡住工人的產能**。
# 一個農夫一輪最多採 9 格，而一塊稻田是 8 格、每輪補 1 塊——供給正好追不太上。
# 供給寬鬆的話，對手炸掉一塊田你只是換去採下一塊，「打經濟」就變成沒有意義的動作；
# 卡在剛好，那一發高爆彈才真的讓你下一輪少一筆錢。
#
# 這也讓 max_workers 沒那麼關鍵：雇第二個農夫會直接搶第一個的活，自己就不划算了。
#
# min_distance 8 是為了讓工人**離開牆的保護**：縮在家裡蓋一圈厚牆的打法，
# 代價就是工人得走到外面去。往外的環形是隨機抽的，所以節點會慢慢往外散。
nodes:
  ore:
    name: 礦脈
    building: ore_vein
    # 26.2 的硫磺洞窟帶來的兩種新方塊。它們只是字串，換成 minecraft:gold_block
    # 或任何別的東西都不影響任何邏輯
    harvestable:
      - minecraft:cinnabar
      - minecraft:sulfur
    per_round: 1
    max: 2
    min_distance: 8
    max_distance: 22

  rice:
    name: 稻田
    building: rice_paddy
    harvestable:
      - minecraft:wheat
    per_round: 1
    max: 2
    min_distance: 8
    max_distance: 22


# 每一方最多雇幾個工人。
#
# 沒有上限的話最優解固定是「把每一塊錢都滾成工人」，其他所有購買都不用考慮了。
# 上面的節點供給其實已經先卡住產能，這條只是兜底
max_workers: 4
