# 要塞對戰 — NPC
#
# 跟怪物一樣不註冊新實體：拿一個原版實體當殼，關掉 AI，右鍵它就開商店。
# NPC 打得死，沒有無敵也不會重生。
# 放在哪裡由 buildings.yml 決定（建築的 npc 欄位）。
#
# 欄位
#   name          頭上顯示的名字
#   entity        用哪個原版實體當殼
#   shop          右鍵開哪一間店（對應 shops.yml）；留空 = 純裝飾
#   health        血量。NPC 打得死——軍火商是玩家要保護的資產，他一倒那一側就補不到
#                 子彈，所以「先做掉對方的商人」是一條有效的戰術
#   name_visible  名字要不要一直顯示

# 為什麼是羊駝：原版自己就用牠當商人的馱獸（流浪商人牽的就是羊駝），所以不用解釋
# 任何東西，玩家看到就懂那是誰。
#
# 高度也是選它的理由之一，而且是平衡上的：商人是**戰術目標**（打死他那一側就補不到子彈），
# 所以他好不好藏、好不好狙，取決於這隻實體多高。羊駝 1.87 跟原本的村民 1.95 幾乎一樣——
# 換模型不會順便改掉「狙掉對方商人」的難度。想讓他更難藏就換駱駝（2.38），
# 想讓保護商人變成重點就換驢（1.6）。
#
# 他身上是**原版 AI**：會自己走動、會被推、可以用拴繩牽走，那些全部交給原版。
# 我們只加一條原版不知道的規則——他不能離開你的半場（見 NpcBounds）。拴繩在商店裡買得到。
#
# 代價是他不再是一根釘死的柱子：整場下來他會在你的半場裡慢慢晃。想要他站著別動的話，
# NpcManager 的 spawn 加回 setNoAi(true) 就好，但那同時會關掉原版牽引依賴的導航。
npcs:
  arms_dealer:
    name: §6軍火商
    entity: minecraft:llama
    shop: arms_dealer
    health: 200
    name_visible: true

  # 音樂家。他的貨架不在 shops.yml 裡——是從 songs.yml 的曲目表生出來的（見 SongShop），
  # 所以加一首歌不用動商品清單，寫三行在 songs.yml 就會多一格。
  #
  # 為什麼是村民：他要跟軍火商（羊駝）一眼分得出來，而村民是原版最直白的「這個人可以互動」。
  # 血量比軍火商低很多是刻意的——點歌不影響勝負，他不是戰術資產，打掉他只是掃興，
  # 不該值得對手花一發子彈（但真的想掃興的話還是打得死）
  musician:
    name: §b音樂家
    entity: minecraft:villager
    shop: musician
    health: 60
    name_visible: true

  # ---- 工人 ----
  #
  # 礦工與農夫（他們做什麼、賺多少在 jobs.yml）。跟軍火商是同一種東西，只是 shop 留空——
  # 右鍵他們不會開店，他們自己會走去礦脈與稻田工作。
  #
  # health 60 大約是軍火商的三成：他們是**消耗品**，不是要你死守的資產。
  # 軍火商倒了那一側整場都補不到子彈，所以他該很耐打；工人倒了只是少一份收入，
  # 再花一次本金就補得回來。而且工人的工作地點本來就在牆外（jobs.yml 的 min_distance），
  # 給他高血量等於讓那個「走出去是有代價的」設計失效。
  #
  # 兩個都用村民當殼是刻意的：他們身上是原版 AI，而村民的導航最穩。想換成別的實體要注意
  # 兩件事——流浪商人有自己的消失計時器（會憑空不見），敵對生物會反過來打你。
  # 名字前面的顏色碼就足以在場上分辨誰是誰
  miner:
    name: §8礦工
    entity: minecraft:villager
    shop: ""
    health: 60
    name_visible: true

  farmer:
    name: §a農夫
    entity: minecraft:villager
    shop: ""
    health: 60
    name_visible: true

  # 建築師巴布。由突發事件放到場上（incidents.yml 的 architect_bob），兩邊各一個。
  #
  # 跟軍火商一樣打得死、不會重生——所以「先做掉對方的建築師」是一條真的戰術。
  # 血量比軍火商低：他是這一輪的機會，不是整場的命脈，守不住就是守不住
  architect_bob:
    name: 建築師巴布
    entity: minecraft:villager
    shop: architect
    health: 60
    name_visible: true
