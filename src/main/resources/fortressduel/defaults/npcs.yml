# 要塞對戰 — NPC
#
# 跟怪物一樣不註冊新實體：拿一個原版實體當殼，關掉 AI，右鍵它就開商店。
# NPC 打得死，沒有無敵也不會重生。
# 放在哪裡由 buildings.yml 決定（建築的 npc 欄位）。
#
# 欄位
#   name          頭上顯示的名字
#   entity        用哪個原版實體當殼
#   shop          右鍵開哪一間店（對應 shops.yml）；留空 = 純裝飾
#   health        血量。NPC 打得死——軍火商是玩家要保護的資產，他一倒那一側就補不到
#                 子彈，所以「先做掉對方的商人」是一條有效的戰術
#   name_visible  名字要不要一直顯示

npcs:
  arms_dealer:
    name: §6軍火商
    entity: minecraft:villager
    shop: arms_dealer
    health: 200
    name_visible: true
