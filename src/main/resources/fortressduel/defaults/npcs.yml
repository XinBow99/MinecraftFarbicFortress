# 要塞對戰 — NPC
#
# 跟怪物一樣不註冊新實體：拿一個原版實體當殼，關掉 AI，右鍵它就開商店。
# NPC 打得死，沒有無敵也不會重生。
# 放在哪裡由 buildings.yml 決定（建築的 npc 欄位）。
#
# 欄位
#   name          頭上顯示的名字
#   entity        用哪個原版實體當殼
#   shop          右鍵開哪一間店（對應 shops.yml）；留空 = 純裝飾
#   health        血量。NPC 打得死——軍火商是玩家要保護的資產，他一倒那一側就補不到
#                 子彈，所以「先做掉對方的商人」是一條有效的戰術
#   name_visible  名字要不要一直顯示

# 為什麼是羊駝：原版自己就用牠當商人的馱獸（流浪商人牽的就是羊駝），所以不用解釋
# 任何東西，玩家看到就懂那是誰。
#
# 高度也是選它的理由之一，而且是平衡上的：商人是**戰術目標**（打死他那一側就補不到子彈），
# 所以他好不好藏、好不好狙，取決於這隻實體多高。羊駝 1.87 跟原本的村民 1.95 幾乎一樣——
# 換模型不會順便改掉「狙掉對方商人」的難度。想讓他更難藏就換駱駝（2.38），
# 想讓保護商人變成重點就換驢（1.6）。
#
# 他身上是**原版 AI**：會自己走動、會被推、可以用拴繩牽走，那些全部交給原版。
# 我們只加一條原版不知道的規則——他不能離開你的半場（見 NpcBounds）。拴繩在商店裡買得到。
#
# 代價是他不再是一根釘死的柱子：整場下來他會在你的半場裡慢慢晃。想要他站著別動的話，
# NpcManager 的 spawn 加回 setNoAi(true) 就好，但那同時會關掉原版牽引依賴的導航。
npcs:
  arms_dealer:
    name: §6軍火商
    entity: minecraft:llama
    shop: arms_dealer
    health: 200
    name_visible: true
