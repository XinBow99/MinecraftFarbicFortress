# 要塞對戰 — 武器
#
# 數值移植自網頁版的 AMMO 表。建材不用買（自己挖、自己蓋），彈藥要去軍火商買。
#
# **全場只有一把弓，副手放什麼彈藥就射什麼。**
# 主手拿弓、副手放 item 指定的物品，按住右鍵拉弓、放開發射，只在攻擊階段有效。
# 這就是原版弓的運作方式（原版找箭也是優先看副手），所以玩家不用學新規則；而且彈藥是真的
# 背包物品，剩幾發由原版自己畫在那一格上，HUD 不用再擠一段數字。
#
# 方塊血量 = 原版硬度 × duel.yml 的 weapon.block_hp_per_hardness（預設 10），
# 所以 damage 是「打幾發破一格」而不是絕對值：石頭硬度 1.5 → 血量 15 → 廢鐵彈(20) 一發破。
#
# 欄位
#   name              顯示名稱
#   item              這種武器的**彈藥物品**。放進副手就是用這把武器
#                     9 種彈藥剛好是 9 個一眼分得出來的原版物品，這是熱鍵欄的辨識依據
#                     ※ 不要用箭類物品（arrow / spectral_arrow / tipped_arrow）：那是原版弓的
#                       原生彈藥，副手放著它等於跟原版搶同一個東西——客戶端會把箭畫上弦，
#                       而一旦哪條路徑沒被 mixin 接住，射出去的會是一支真的原版箭
#   damage            單發傷害（同時作用在方塊與生物上）
#   splash_radius     濺射半徑（格），0 = 單點命中
#   pierce            穿甲 0~1。折減目標方塊的血量，1.0 = 血量壓到 1（一發破，但仍要打中）
#   pierce_blocks     穿甲只對哪幾種方塊生效。留空（預設）= 對所有方塊生效。
#                     填了名單就是一把「剋制型」彈藥：名單內一發破，名單外完全沒有穿甲
#   knockback         命中生物時推開的力道（格/tick）。0 = 不推
#                     不寫的話 = damage × 0.008，所以舊設定檔不改也會有力道感
#                     濺射武器照爆心距離衰減，跟傷害用同一條曲線
#   charge            蓄力設定
#     curve           力道曲線。vanilla（前快後緩）/ linear，或直接畫折線：
#                     [[0, 0.2], [0.7, 0.45], [1.0, 1.0]] = 後段暴衝，逼你拉滿
#     min_draw        低於這個力道就不發射也不耗彈（放空弓只是手滑，不該被罰）
#                     設 0 = 點一下右鍵就發射，射速完全由 cooldown_ticks 決定。
#                     連射武器（機槍 cooldown 3、雷射 2）只能這樣設：滿弓要 20 tick，
#                     套上蓄力等於廢掉它們「連續潑灑」的定位
#     affects         力道影響什麼：speed / damage / spread 可複選，預設只有 speed
#                     連射武器給空的 []，蓄力不影響任何數值
#
#   ※ 滿弓固定 20 tick，這是客戶端寫死的。曲線只改 0→1 之間的形狀，兩端永遠對齊動畫——
#     設成「40 tick 才滿力道」的話，玩家看到的弓在第 20 tick 就拉滿了，視覺會說謊
#   pellets           一次擊發幾顆（散彈）。寫 pellets_max 的話每一發在兩者之間重抽
#   pellets_max       一次最多幾顆。不寫 = 跟 pellets 相同 = 固定顆數
#   spread_degrees    以視線為軸的圓錐半頂角（度）。彈著點在圓盤上均勻分布
#
#                     ※ 這個遊戲**沒有後座力**：散佈角從頭到尾就是 spread_degrees，
#                       開幾槍都不會變。曾經有過 recoil / recoil_max / recoil_recovery
#                       三個欄位，拿掉是因為「連射會越打越歪」讓每一把槍打起來都黏手，
#                       而準度的取捨已經由 spread_degrees 自己表達完了。
#                       舊設定檔留著那三個鍵不會報錯，只是完全沒有作用
#   cooldown_ticks    裝填間隔（20 tick = 1 秒）。開火時副手那疊彈藥會蓋上原版的灰色
#                     冷卻遮罩，所以玩家不用背秒數也看得到什麼時候能打下一發
#   projectile_speed  彈丸初速（格/tick）
#   gravity           重力（格/tick²），0 = 直線飛行
#   lifetime_ticks    飛多久之後自己消失。**這是安全網，不是射程**——彈丸一飛出框線就會被
#                     清掉（3D 判斷，見 WeaponSystem.step），所以正常情況根本用不到它。
#                     設太小的話它會變成一道看不見的牆：拋高一點的那一發在半空中憑空消失，
#                     而玩家不會知道為什麼。預設值都給到「最大的場地也飛得完一整條拋物線」
#
#                     射程的真正來源是 gravity：平射時彈丸多快落地。那條是可以靠抬高瞄準
#                     補償的，也就是玩家的操作空間——所以限制射程要調 gravity，不要調壽命
#
#                     ※ **每一種彈藥都必須打得到對面的玻璃牆。**
#                       45 度最大射程 ≈ projectile_speed² ÷ gravity（零重力的是 speed × lifetime_ticks），
#                       而場地最大 132 格見方（見 duel.yml 的 arena.size／margin 與 challenge.max_distance）。
#
#                       這條不是美觀問題：射程不夠的彈藥不會報錯，只會在遠距離開局時「老是差一點」，
#                       而玩家沒辦法知道為什麼。所以開場時程式會實際算一遍，構不到的會警告並告訴雙方
#                       （見 WeaponSystem.shortRangedFor）。改 gravity 或 projectile_speed 之後記得看那行。
#
#                       目前：狙擊 2500、導彈 500、機槍 481、無人機 420、雷射 400、
#                             穿甲 385、廢鐵 225、散彈 193、高爆／寶貝蛋 192
#   auto              true  = 按住右鍵就一直打，射速完全由 cooldown_ticks 決定，蓄力不參與
#                     false = 拉弓、放開，發一發（預設）
#                     連射武器只能設 true：機槍 cooldown 3、雷射 2，也就是每秒 7~10 發，
#                     靠連點右鍵打到那個速度手感差得有感
#   breaks_blocks     命中的方塊會不會被打掉（只在競技場範圍內生效）
#   spawn_mobs        命中時在落點孵出哪幾種怪（mobs.yml 的 id），逐隻隨機。
#                     **填了這一欄的彈藥完全不造成傷害、也不碰方塊**，只放怪——
#                     所以它的 damage 與 splash_radius 寫什麼都沒有作用
#   spawn_min/max     一發放幾隻，每一發在兩者之間重抽
#   trail_particle    飛行時拖的粒子（沒指定 trail_color 時才用它）
#   trail_color       彈道的顏色，"#RRGGBB"。指定之後就改走 dust 粒子——那是原版唯一能
#                     任意上色的粒子，所以「紫色的光束」這種需求只能從這裡來。
#                     trail_particle 只吃得下一個 id，塞不進顏色，所以是兩個欄位
#                     寫法三種都吃：#A020F0 / A020F0 / 0xA020F0
#   trail_scale       粒子大小倍率，預設 1.4。只有指定 trail_color 時有意義（dust 才吃得到）
#   fire_sound        開火音效
#   ammo_per_shot     一次擊發消耗幾發（散彈打六七顆但只算 1 發，跟 pellets 是兩回事）
#                     只從**副手那一疊**扣，不會去背包裡湊——副手就是上膛的彈匣
#   starting_ammo     開場就配給的量。預設全部 0——開場不發任何東西，所有補給都要跟軍火商買，
#                     那是這個遊戲唯一的資源出口（見 duel.yml 的 battle.starting_items）

weapons:
  scrap:
    name: 廢鐵彈
    item: minecraft:iron_nugget
    damage: 20
    splash_radius: 0
    pierce: 0
    knockback: 0.16
    # 萬用彈：門檻低、蓄力只影響射程，隨手打也打得出去
    charge:
      curve: vanilla
      min_draw: 0.1
      affects: [speed]
    spread_degrees: 1.0
    # 0.9 秒一發：全場最寬鬆的節奏，它本來就是給人隨手打的萬用彈
    cooldown_ticks: 18
    projectile_speed: 3.0
    gravity: 0.04
    lifetime_ticks: 200
    breaks_blocks: true
    trail_particle: minecraft:crit
    trail_color: "#C8C8C8"
    fire_sound: minecraft:entity.arrow.shoot
    starting_ammo: 0

  mg:
    name: 機槍彈
    item: minecraft:copper_ingot
    damage: 12
    splash_radius: 0
    pierce: 0
    # 每秒近 7 發，單發推得多一點點就會把人黏在牆上動不了
    knockback: 0.08
    # 連射武器：auto: true ＝ 按住右鍵就一直打，射速完全由 cooldown 決定（每秒近 7 發）。
    # 蓄力完全不參與——滿弓 20 tick 比它的 cooldown 慢七倍，套上去等於廢掉「連續潑灑」的定位
    charge:
      min_draw: 0
      affects: []
    spread_degrees: 3.0
    # 連射的代價在散佈與彈藥消耗：3 度的底噪讓它在 20 格外就潑不準，
    # 而每秒近 7 發等於每秒近 $9。它買的是壓制與近距離的爆發，不是遠射
    cooldown_ticks: 3
    projectile_speed: 3.8
    gravity: 0.03
    lifetime_ticks: 200
    auto: true
    breaks_blocks: true
    trail_particle: minecraft:smoke
    trail_color: "#FFB03A"
    fire_sound: minecraft:entity.arrow.shoot
    starting_ammo: 0

  ap:
    name: 穿甲彈
    item: minecraft:iron_ingot
    # 基礎傷害刻意壓低：它是破甲彈不是萬用拆牆彈。對名單外的建材就只有這 8 點——
    # 石頭要 2 發、木頭 3 發、黑曜石 63 發，每一項都是全場最差的選擇之一
    damage: 8
    splash_radius: 0
    # 完全無視硬度，但**只對鐵塊**（見 pierce_blocks）
    pierce: 1.0
    # 穿甲只吃這幾種方塊。名單外的方塊等於沒有穿甲，只剩上面那 8 點傷害。
    #
    # 這是「剋制」跟「泛用」的分界。名單留空的話（狙擊與導彈就是留空）穿甲對所有方塊
    # 一視同仁，那會讓一種彈藥同時是最便宜**又**最快的拆牆手段，其他選擇全部失去意義。
    # 綁定鐵塊之後它有了明確的位置：鐵塊 $5/格、穿甲彈 $5/發、一發一格——剛好打平，
    # 所以鐵塊買到的是時間而不是免疫，而攻方也得先猜對方蓋的是不是鐵
    pierce_blocks:
      - minecraft:iron_block
    knockback: 0.16
    # 力道決定傷害：半弓打不穿鐵塊，逼你把整發拉滿再放
    charge:
      curve: linear
      min_draw: 0.25
      affects: [damage]
    spread_degrees: 1.6
    # 1 秒一發：它一發破一格鐵塊，沒有這個節奏限制的話那面牆等於紙做的
    cooldown_ticks: 20
    projectile_speed: 3.4
    gravity: 0.03
    lifetime_ticks: 200
    breaks_blocks: true
    trail_particle: minecraft:enchanted_hit
    trail_color: "#5AC8FF"
    fire_sound: minecraft:item.crossbow.shoot

  # 真正的霰彈：一次 6~7 顆散在一個 6 度的圓錐裡。
  #
  # 每一發重抽顆數（pellets ~ pellets_max），因為散彈的手感有一半來自「這一發到底
  # 打出去多少」不是固定的——固定顆數時彈著雖然隨機，但總火力恆定，打起來像一把
  # 數值穩定的槍而不是霰彈。
  #
  # 單顆 16，滿中一發 6.5 × 16 ≈ 104。
  #
  # 定價沿革：曾經是 11、後來降到 8（顆數從 5 提到 6~7 時為了維持總火力不變），但那個
  # 「總火力不變」是拿滿中算的，而散彈幾乎不會滿中——6 度的圓錐在十幾格外就散開三格，
  # 實際只中一兩顆。單顆 8 的話中兩顆才 16 點，比隨手一發廢鐵彈（20）還低，那把武器
  # 就沒有理由存在了。提到 16 之後中兩顆 32、中三顆 48，貼臉全中破百——距離曲線很陡，
  # 而那個陡度本來就是霰彈的定位。
  #
  # 副作用要知道：單顆 16 對只有 20 血的玩家來說，**中一顆就幾乎致命**（原本要中兩顆）。
  # 對牆則是單顆就破石頭（15）與木板（10），所以貼臉掃牆會變快很多。
  #
  # 散佈 6 度：1.5 度在 15 格外只散開一格多，那是獨頭彈不是霰彈。
  # 6 度大約是 15 格外散開三格，貼臉幾乎全中、拉開就只中一兩顆——這才是它該有的距離曲線
  buck:
    name: 散彈
    item: minecraft:flint
    damage: 16
    splash_radius: 0
    pierce: 0
    # 逐顆結算，貼臉全中等於推六七次
    knockback: 0.09
    # 力道收攏彈著：速射噴一片，拉滿才是一束
    charge:
      curve: linear
      min_draw: 0.15
      affects: [spread]
    pellets: 6
    pellets_max: 7
    spread_degrees: 6.0
    # 散佈本來就大：6 度在 15 格外就散開三格，這是逼你貼近，不是逼你控制節奏
    cooldown_ticks: 24
    projectile_speed: 2.6
    # 0.05 → 0.035：45 度射程 135 → 193 格。散彈的「短距離武器」定位靠的是**散佈**
    # （6 度，15 格外就散開三格），不是靠彈丸中途掉下來——後者只是讓遠射變成憑空消失
    gravity: 0.035
    lifetime_ticks: 200
    breaks_blocks: true
    trail_particle: minecraft:crit
    trail_color: "#FFE9A8"
    fire_sound: minecraft:entity.firework_rocket.blast

  sniper:
    name: 狙擊彈
    # 不能用箭類物品（原本是 spectral_arrow）：箭是原版弓的**原生彈藥**，副手放著它的話
    # 我們的機制會跟原版搶同一個東西——客戶端會把箭畫上弦、而一旦哪條路徑沒被 mixin 接住
    # （沒在對戰中、或判斷失效），射出去的就是一支真的原版箭。長條狀的火焰棒一眼分得出來，
    # 而且沒有任何原版右鍵行為
    item: minecraft:blaze_rod
    damage: 52
    splash_radius: 0
    pierce: 0.25
    knockback: 0.45
    # 門檻最高，逼你站定。affects 是空的不是漏寫：spread_degrees 已經是 0，
    # 力道對散佈再乘一次還是 0——寫 [spread] 只是一句沒有作用的宣告
    charge:
      curve: linear
      min_draw: 0.3
      affects: []
    # 完全不散：這把槍指哪打哪，限制它的是價格與 30 tick 的裝填，不是準度
    spread_degrees: 0
    # 所以分界線落在「你有沒有在瞄」：慢慢打的狙擊手不受影響，拿它掃怪的人會越打越歪。
    #
    # 這是衝著中場搶賞金來的。賞金是先殺先得、贏者全拿，所以重點不是「每塊錢多少傷害」
    # （狙擊本來就是全場最貴的），是**清場速度**——平直彈道 + 永不失準的話，別人還在算
    # 拋物線落點，狙擊已經一發一隻把整群收乾淨了。現在它得慢下來，那段時間就是別人的機會
    cooldown_ticks: 30
    projectile_speed: 5.0
    # 彈道平直：重力極低（平射約 93 格才落地），背下來的落點不會隨距離大幅改變。
    # 射程由這條決定，不是由壽命——想讓它更短就調大這個數字
    gravity: 0.01
    lifetime_ticks: 200
    breaks_blocks: true
    trail_particle: minecraft:end_rod
    trail_color: "#FFFFFF"
    trail_scale: 0.9
    fire_sound: minecraft:item.crossbow.shoot

  he:
    name: 高爆彈
    item: minecraft:tnt
    damage: 38
    splash_radius: 2.5
    pierce: 0
    knockback: 0.7
    # 慢速拋物線本來就該蓄力：力道決定射程，拉弓變成測距的動作
    charge:
      curve: linear      # 線性最好抓落點
      min_draw: 0.2
      affects: [speed]   # 只影響射程，傷害維持固定，平衡不位移
    spread_degrees: 1.6
    # 1.6 度在 20 格外只偏 0.56 格，而它的濺射半徑就有 2.5 格——散佈對高爆彈幾乎沒有意義，
    # 真正限制它的是 2 秒的冷卻
    cooldown_ticks: 40
    projectile_speed: 2.4
    # 0.06 → 0.03：舊值的 45 度最大射程只有 96 格，而場地最大可以到 132 格見方，
    # 也就是站遠一點的開局它連對面的玻璃牆都構不到——而且是靜悄悄地構不到，
    # 玩家只會覺得「我的高爆彈老是差一點」。全場每一種彈藥都該打得到對面的牆，見檔案頭
    gravity: 0.03
    lifetime_ticks: 200
    breaks_blocks: true
    trail_particle: minecraft:flame
    trail_color: "#FF5A2A"
    fire_sound: minecraft:entity.generic.explode

  laser:
    name: 雷射
    item: minecraft:amethyst_shard
    damage: 5
    splash_radius: 0
    pierce: 0
    knockback: 0.03
    # 同機槍：auto: true，按住就一直打（每秒 10 發），蓄力不參與
    charge:
      min_draw: 0
      affects: []
    spread_degrees: 0.3
    # 每秒 10 發。限制它的是彈藥消耗與 0 重力帶來的固定彈道，不是準度
    cooldown_ticks: 2
    # 一 tick 飛 20 格 + 零重力 ＝ 幾乎是即時命中的直線光束。
    # 壽命曾經是 6，那等於一道 120 格的硬牆——雙方站得遠一點時它連場地都跨不過去，
    # 而畫面上只會看到光束在半空中斷掉
    projectile_speed: 20.0
    gravity: 0
    lifetime_ticks: 20
    auto: true
    breaks_blocks: true
    trail_particle: minecraft:end_rod
    trail_color: "#A020F0"
    trail_scale: 1.8
    fire_sound: minecraft:block.beacon.power_select

  missile:
    name: 導彈
    item: minecraft:firework_rocket
    damage: 180
    splash_radius: 1.5
    pierce: 0.5
    knockback: 1.5
    charge:
      curve: linear
      min_draw: 0.2
      affects: [speed]
    spread_degrees: 0
    cooldown_ticks: 80
    projectile_speed: 2.0
    gravity: 0
    lifetime_ticks: 250
    breaks_blocks: true
    trail_particle: minecraft:flame
    trail_color: "#FF2E2E"
    trail_scale: 1.8
    fire_sound: minecraft:entity.firework_rocket.launch

  # 寶貝蛋：唯一一發**不造成任何傷害**的彈藥。落地孵出 1~2 隻隨機敵對生物。
  #
  # 飛行參數整組照抄高爆彈（初速 2.4、重力 0.06、蓄力影響射程），所以會用高爆彈的人
  # 立刻就會丟這顆——它們的落點是一樣的。這是刻意的：學一條拋物線，兩種用途。
  #
  # damage 與 splash_radius 寫著但完全不生效（spawn_mobs 有東西就走另一條命中路徑），
  # 留 0 是為了不讓人以為它偷偷有傷害。
  #
  # 它賣的是**打斷對手的節奏**。中場的怪是收入、鼠疫是災難，這顆是「有人正在對你使壞」——
  # 唯一一個由對手主動決定什麼時候發生的干擾，而那個差別是心理上的。
  # 對方正在專心蓋牆或瞄準時，牆角忽然冒出一隻衛道士，他得放下手上的事。
  #
  # 六種可能的生物裡苦力怕真的會炸掉牆（見 mobs.yml 的 pest），所以它不是純惡作劇，
  # 但期望值不高——一半的機率你只是丟了一隻煩人的東西過去。
  #
  # 冷卻 60 tick（3 秒）比高爆彈慢：它不該能連續丟，那會變成刷怪塔
  egg:
    name: 寶貝蛋
    item: minecraft:turtle_egg
    damage: 0
    splash_radius: 0
    pierce: 0
    knockback: 0
    charge:
      curve: linear
      min_draw: 0.2
      affects: [speed]
    spread_degrees: 1.6
    cooldown_ticks: 60
    projectile_speed: 2.4
    # 跟高爆彈一起從 0.06 調到 0.03（它整組飛行參數都照抄高爆彈）
    gravity: 0.03
    lifetime_ticks: 200
    # false：這顆不碰方塊，落在牆上就在那裡孵
    breaks_blocks: false
    # 命中時放 1~2 隻，每一發重抽。種類從 mobs.yml 的 pest 逐隻隨機
    spawn_mobs: [pest]
    spawn_min: 1
    spawn_max: 2
    trail_particle: minecraft:happy_villager
    trail_color: "#7CE07C"
    trail_scale: 1.5
    fire_sound: minecraft:entity.egg.throw

  drone:
    name: 無人機
    item: minecraft:ender_eye
    damage: 70
    splash_radius: 3.5
    pierce: 0
    knockback: 1.0
    charge:
      curve: linear
      min_draw: 0.2
      affects: [speed]
    spread_degrees: 0
    cooldown_ticks: 120
    projectile_speed: 1.4
    gravity: 0
    lifetime_ticks: 300
    breaks_blocks: true
    trail_particle: minecraft:portal
    trail_color: "#00E5A0"
    trail_scale: 1.6
    fire_sound: minecraft:entity.generic.explode
