# 要塞對戰 — 武器
#
# 數值移植自網頁版的 AMMO 表。建材不用買（自己挖、自己蓋），彈藥要去軍火商買。
#
# **全場只有一把弓，副手放什麼彈藥就射什麼。**
# 主手拿弓、副手放 item 指定的物品，按住右鍵拉弓、放開發射，只在攻擊階段有效。
# 這就是原版弓的運作方式（原版找箭也是優先看副手），所以玩家不用學新規則；而且彈藥是真的
# 背包物品，剩幾發由原版自己畫在那一格上，HUD 不用再擠一段數字。
#
# 方塊血量 = 原版硬度 × duel.yml 的 weapon.block_hp_per_hardness（預設 10），
# 所以 damage 是「打幾發破一格」而不是絕對值：石頭硬度 1.5 → 血量 15 → 廢鐵彈(20) 一發破。
#
# 欄位
#   name              顯示名稱
#   item              這種武器的**彈藥物品**。放進副手就是用這把武器
#                     9 種彈藥剛好是 9 個一眼分得出來的原版物品，這是熱鍵欄的辨識依據
#                     ※ 不要用箭類物品（arrow / spectral_arrow / tipped_arrow）：那是原版弓的
#                       原生彈藥，副手放著它等於跟原版搶同一個東西——客戶端會把箭畫上弦，
#                       而一旦哪條路徑沒被 mixin 接住，射出去的會是一支真的原版箭
#   damage            單發傷害（同時作用在方塊與生物上）
#   splash_radius     濺射半徑（格），0 = 單點命中
#   pierce            穿甲 0~1。折減目標方塊的血量，1.0 = 血量壓到 1（一發破，但仍要打中）
#   pierce_blocks     穿甲只對哪幾種方塊生效。留空（預設）= 對所有方塊生效。
#                     填了名單就是一把「剋制型」彈藥：名單內一發破，名單外完全沒有穿甲
#   knockback         命中生物時推開的力道（格/tick）。0 = 不推
#                     不寫的話 = damage × 0.008，所以舊設定檔不改也會有力道感
#                     濺射武器照爆心距離衰減，跟傷害用同一條曲線
#   charge            蓄力設定
#     curve           力道曲線。vanilla（前快後緩）/ linear，或直接畫折線：
#                     [[0, 0.2], [0.7, 0.45], [1.0, 1.0]] = 後段暴衝，逼你拉滿
#     min_draw        低於這個力道就不發射也不耗彈（放空弓只是手滑，不該被罰）
#                     設 0 = 點一下右鍵就發射，射速完全由 cooldown_ticks 決定。
#                     連射武器（機槍 cooldown 3、雷射 2）只能這樣設：滿弓要 20 tick，
#                     套上蓄力等於廢掉它們「連續潑灑」的定位
#     affects         力道影響什麼：speed / damage / spread 可複選，預設只有 speed
#                     連射武器給空的 []，蓄力不影響任何數值
#
#   ※ 滿弓固定 20 tick，這是客戶端寫死的。曲線只改 0→1 之間的形狀，兩端永遠對齊動畫——
#     設成「40 tick 才滿力道」的話，玩家看到的弓在第 20 tick 就拉滿了，視覺會說謊
#   pellets           一次擊發幾顆（散彈）。寫 pellets_max 的話每一發在兩者之間重抽
#   pellets_max       一次最多幾顆。不寫 = 跟 pellets 相同 = 固定顆數
#   spread_degrees    以視線為軸的圓錐半頂角（度）。彈著點在圓盤上均勻分布
#   recoil            後座力：每擊發一次散佈額外增加幾度
#                     不寫的話 = spread_degrees × 0.5，所以舊設定檔不改也會有後座力
#   recoil_max        後座力累積的上限（度）。不寫 = max(3, spread_degrees × 3)
#   recoil_recovery   後座力每秒回復幾度。固定速率，不是按比例衰減——
#                     「停火多久才會恢復準度」要能被背下來
#   cooldown_ticks    裝填間隔（20 tick = 1 秒）
#   projectile_speed  彈丸初速（格/tick）
#   gravity           重力（格/tick²），0 = 直線飛行
#   lifetime_ticks    飛多久之後自己消失。**這是安全網，不是射程**——彈丸一飛出框線就會被
#                     清掉（3D 判斷，見 WeaponSystem.step），所以正常情況根本用不到它。
#                     設太小的話它會變成一道看不見的牆：拋高一點的那一發在半空中憑空消失，
#                     而玩家不會知道為什麼。預設值都給到「最大的場地也飛得完一整條拋物線」
#
#                     射程的真正來源是 gravity：平射時彈丸多快落地。那條是可以靠抬高瞄準
#                     補償的，也就是玩家的操作空間——所以限制射程要調 gravity，不要調壽命
#   auto              true  = 按住右鍵就一直打，射速完全由 cooldown_ticks 決定，蓄力不參與
#                     false = 拉弓、放開，發一發（預設）
#                     連射武器只能設 true：機槍 cooldown 3、雷射 2，也就是每秒 7~10 發，
#                     靠連點右鍵打到那個速度手感差得有感
#   breaks_blocks     命中的方塊會不會被打掉（只在競技場範圍內生效）
#   trail_particle    飛行時拖的粒子（沒指定 trail_color 時才用它）
#   trail_color       彈道的顏色，"#RRGGBB"。指定之後就改走 dust 粒子——那是原版唯一能
#                     任意上色的粒子，所以「紫色的光束」這種需求只能從這裡來。
#                     trail_particle 只吃得下一個 id，塞不進顏色，所以是兩個欄位
#                     寫法三種都吃：#A020F0 / A020F0 / 0xA020F0
#   trail_scale       粒子大小倍率，預設 1.4。只有指定 trail_color 時有意義（dust 才吃得到）
#   fire_sound        開火音效
#   ammo_per_shot     一次擊發消耗幾發（散彈打六七顆但只算 1 發，跟 pellets 是兩回事）
#                     只從**副手那一疊**扣，不會去背包裡湊——副手就是上膛的彈匣
#   starting_ammo     開場就配給的量。預設全部 0——開場不發任何東西，所有補給都要跟軍火商買，
#                     那是這個遊戲唯一的資源出口（見 duel.yml 的 battle.starting_items）

weapons:
  scrap:
    name: 廢鐵彈
    item: minecraft:iron_nugget
    damage: 20
    splash_radius: 0
    pierce: 0
    knockback: 0.16
    # 萬用彈：門檻低、蓄力只影響射程，隨手打也打得出去
    charge:
      curve: vanilla
      min_draw: 0.1
      affects: [speed]
    spread_degrees: 1.0
    recoil: 0.6
    recoil_max: 4.0
    recoil_recovery: 6.0
    cooldown_ticks: 18
    projectile_speed: 3.0
    gravity: 0.04
    lifetime_ticks: 200
    breaks_blocks: true
    trail_particle: minecraft:crit
    trail_color: "#C8C8C8"
    fire_sound: minecraft:entity.arrow.shoot
    starting_ammo: 0

  mg:
    name: 機槍彈
    item: minecraft:copper_ingot
    damage: 12
    splash_radius: 0
    pierce: 0
    # 每秒近 7 發，單發推得多一點點就會把人黏在牆上動不了
    knockback: 0.08
    # 連射武器：auto: true ＝ 按住右鍵就一直打，射速完全由 cooldown 決定（每秒近 7 發）。
    # 蓄力完全不參與——滿弓 20 tick 比它的 cooldown 慢七倍，套上去等於廢掉「連續潑灑」的定位
    charge:
      min_draw: 0
      affects: []
    spread_degrees: 3.0
    # 連射的代價全在這裡：打滿一梭最後幾發已經散到 9 度
    recoil: 0.9
    recoil_max: 9.0
    recoil_recovery: 7.0
    cooldown_ticks: 3
    projectile_speed: 3.8
    gravity: 0.03
    lifetime_ticks: 200
    auto: true
    breaks_blocks: true
    trail_particle: minecraft:smoke
    trail_color: "#FFB03A"
    fire_sound: minecraft:entity.arrow.shoot
    starting_ammo: 0

  ap:
    name: 穿甲彈
    item: minecraft:iron_ingot
    # 基礎傷害刻意壓低：它是破甲彈不是萬用拆牆彈。對名單外的建材就只有這 8 點——
    # 石頭要 2 發、木頭 3 發、黑曜石 63 發，每一項都是全場最差的選擇之一
    damage: 8
    splash_radius: 0
    # 完全無視硬度，但**只對鐵塊**（見 pierce_blocks）
    pierce: 1.0
    # 穿甲只吃這幾種方塊。名單外的方塊等於沒有穿甲，只剩上面那 8 點傷害。
    #
    # 這是「剋制」跟「泛用」的分界。名單留空的話（狙擊與導彈就是留空）穿甲對所有方塊
    # 一視同仁，那會讓一種彈藥同時是最便宜**又**最快的拆牆手段，其他選擇全部失去意義。
    # 綁定鐵塊之後它有了明確的位置：鐵塊 $5/格、穿甲彈 $5/發、一發一格——剛好打平，
    # 所以鐵塊買到的是時間而不是免疫，而攻方也得先猜對方蓋的是不是鐵
    pierce_blocks:
      - minecraft:iron_block
    knockback: 0.16
    # 力道決定傷害：半弓打不穿鐵塊，逼你把整發拉滿再放
    charge:
      curve: linear
      min_draw: 0.25
      affects: [damage]
    spread_degrees: 1.6
    recoil: 0.8
    recoil_max: 4.0
    recoil_recovery: 5.0
    cooldown_ticks: 20
    projectile_speed: 3.4
    gravity: 0.03
    lifetime_ticks: 200
    breaks_blocks: true
    trail_particle: minecraft:enchanted_hit
    trail_color: "#5AC8FF"
    fire_sound: minecraft:item.crossbow.shoot

  # 真正的霰彈：一次 6~7 顆散在一個 6 度的圓錐裡。
  #
  # 每一發重抽顆數（pellets ~ pellets_max），因為散彈的手感有一半來自「這一發到底
  # 打出去多少」不是固定的——固定顆數時彈著雖然隨機，但總火力恆定，打起來像一把
  # 數值穩定的槍而不是霰彈。
  #
  # 單顆傷害從 11 降到 8：6.5 顆 × 8 ≈ 52，跟舊的 5 × 11 = 55 幾乎一樣，所以
  # 商店那個 $140/40 的定價不用跟著動。
  #
  # 散佈從 1.5 度拉到 6 度：1.5 度在 15 格外只散開一格多，那是獨頭彈不是霰彈。
  # 6 度大約是 15 格外散開三格，貼臉幾乎全中、拉開就只中一兩顆——這才是它該有的距離曲線
  buck:
    name: 散彈
    item: minecraft:flint
    damage: 8
    splash_radius: 0
    pierce: 0
    # 逐顆結算，貼臉全中等於推六七次
    knockback: 0.09
    # 力道收攏彈著：速射噴一片，拉滿才是一束
    charge:
      curve: linear
      min_draw: 0.15
      affects: [spread]
    pellets: 6
    pellets_max: 7
    spread_degrees: 6.0
    # 散佈本來就大，後座力再疊上去很快就完全失準——這是逼你控制節奏，不是連射武器
    recoil: 2.0
    recoil_max: 12.0
    recoil_recovery: 8.0
    cooldown_ticks: 24
    projectile_speed: 2.6
    gravity: 0.05
    lifetime_ticks: 200
    breaks_blocks: true
    trail_particle: minecraft:crit
    trail_color: "#FFE9A8"
    fire_sound: minecraft:entity.firework_rocket.blast

  sniper:
    name: 狙擊彈
    # 不能用箭類物品（原本是 spectral_arrow）：箭是原版弓的**原生彈藥**，副手放著它的話
    # 我們的機制會跟原版搶同一個東西——客戶端會把箭畫上弦、而一旦哪條路徑沒被 mixin 接住
    # （沒在對戰中、或判斷失效），射出去的就是一支真的原版箭。長條狀的火焰棒一眼分得出來，
    # 而且沒有任何原版右鍵行為
    item: minecraft:blaze_rod
    damage: 52
    splash_radius: 0
    pierce: 0.25
    knockback: 0.45
    # 逼你站定：門檻最高，而且力道直接換成準度
    charge:
      curve: linear
      min_draw: 0.3
      affects: [spread]
    spread_degrees: 0
    # 單發極準，但連著開就完全失去狙擊的意義
    recoil: 2.5
    recoil_max: 8.0
    recoil_recovery: 10.0
    cooldown_ticks: 30
    projectile_speed: 5.0
    # 彈道平直：重力極低（平射約 93 格才落地），背下來的落點不會隨距離大幅改變。
    # 射程由這條決定，不是由壽命——想讓它更短就調大這個數字
    gravity: 0.01
    lifetime_ticks: 200
    breaks_blocks: true
    trail_particle: minecraft:end_rod
    trail_color: "#FFFFFF"
    trail_scale: 0.9
    fire_sound: minecraft:item.crossbow.shoot

  he:
    name: 高爆彈
    item: minecraft:tnt
    damage: 38
    splash_radius: 2.5
    pierce: 0
    knockback: 0.7
    # 慢速拋物線本來就該蓄力：力道決定射程，拉弓變成測距的動作
    charge:
      curve: linear      # 線性最好抓落點
      min_draw: 0.2
      affects: [speed]   # 只影響射程，傷害維持固定，平衡不位移
    spread_degrees: 1.6
    recoil: 1.2
    recoil_max: 5.0
    recoil_recovery: 6.0
    cooldown_ticks: 40
    projectile_speed: 2.4
    gravity: 0.06
    lifetime_ticks: 200
    breaks_blocks: true
    trail_particle: minecraft:flame
    trail_color: "#FF5A2A"
    fire_sound: minecraft:entity.generic.explode

  laser:
    name: 雷射
    item: minecraft:amethyst_shard
    damage: 5
    splash_radius: 0
    pierce: 0
    knockback: 0.03
    # 同機槍：auto: true，按住就一直打（每秒 10 發），蓄力不參與
    charge:
      min_draw: 0
      affects: []
    spread_degrees: 0.3
    # 每秒 10 發，單發加一點點就會在持續射擊時明顯散開
    recoil: 0.25
    recoil_max: 5.0
    recoil_recovery: 5.0
    cooldown_ticks: 2
    # 一 tick 飛 20 格 + 零重力 ＝ 幾乎是即時命中的直線光束。
    # 壽命曾經是 6，那等於一道 120 格的硬牆——雙方站得遠一點時它連場地都跨不過去，
    # 而畫面上只會看到光束在半空中斷掉
    projectile_speed: 20.0
    gravity: 0
    lifetime_ticks: 20
    auto: true
    breaks_blocks: true
    trail_particle: minecraft:end_rod
    trail_color: "#A020F0"
    trail_scale: 1.8
    fire_sound: minecraft:block.beacon.power_select

  missile:
    name: 導彈
    item: minecraft:firework_rocket
    damage: 180
    splash_radius: 1.5
    pierce: 0.5
    knockback: 1.5
    charge:
      curve: linear
      min_draw: 0.2
      affects: [speed]
    spread_degrees: 0
    # 一次一發、80 tick 裝填，後座力沒有意義
    recoil: 0.0
    recoil_max: 0.0
    recoil_recovery: 6.0
    cooldown_ticks: 80
    projectile_speed: 2.0
    gravity: 0
    lifetime_ticks: 250
    breaks_blocks: true
    trail_particle: minecraft:flame
    trail_color: "#FF2E2E"
    trail_scale: 1.8
    fire_sound: minecraft:entity.firework_rocket.launch

  drone:
    name: 無人機
    item: minecraft:ender_eye
    damage: 70
    splash_radius: 3.5
    pierce: 0
    knockback: 1.0
    charge:
      curve: linear
      min_draw: 0.2
      affects: [speed]
    spread_degrees: 0
    recoil: 0.0
    recoil_max: 0.0
    recoil_recovery: 6.0
    cooldown_ticks: 120
    projectile_speed: 1.4
    gravity: 0
    lifetime_ticks: 300
    breaks_blocks: true
    trail_particle: minecraft:portal
    trail_color: "#00E5A0"
    trail_scale: 1.6
    fire_sound: minecraft:entity.generic.explode
