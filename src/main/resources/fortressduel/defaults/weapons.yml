# 要塞對戰 — 武器
#
# 數值移植自網頁版的 AMMO 表，但拿掉了價格：MC 版不買彈藥，武器就是手上的物品，
# 建材也不用買（自己挖、自己蓋）。
#
# 拿著 item 指定的物品「右鍵」開火，只在對戰的攻擊階段有效。
# 方塊血量 = 原版硬度 × duel.yml 的 weapon.block_hp_per_hardness（預設 10），
# 所以 damage 是「打幾發破一格」而不是絕對值：石頭硬度 1.5 → 血量 15 → 廢鐵彈(20) 一發破。
#
# 欄位
#   name              顯示名稱
#   item              綁定的物品；拿著它右鍵就是用這把武器
#   damage            單發傷害（同時作用在方塊與生物上）
#   splash_radius     濺射半徑（格），0 = 單點命中
#   pierce            穿甲 0~1。折減目標方塊的血量，1.0 = 血量壓到 1（一發破，但仍要打中）
#   knockback         命中生物時推開的力道（格/tick）。0 = 不推
#                     不寫的話 = damage × 0.008，所以舊設定檔不改也會有力道感
#                     濺射武器照爆心距離衰減，跟傷害用同一條曲線
#   launcher          instant = 右鍵即發（預設）
#                     bow     = 拿弓拉滿再放。武器物品會變成一支帶標記的弓，
#                               拉弓動畫與力道回饋由原版客戶端提供，玩家不用裝任何東西
#                     連射武器不能設 bow：滿弓要 20 tick，而機槍的 cooldown 是 3、雷射是 2
#   charge            只有 launcher: bow 時有意義
#     curve           力道曲線。vanilla（前快後緩）/ linear，或直接畫折線：
#                     [[0, 0.2], [0.7, 0.45], [1.0, 1.0]] = 後段暴衝，逼你拉滿
#     min_draw        低於這個力道就不發射也不耗彈（放空弓只是手滑，不該被罰）
#     affects         力道影響什麼：speed / damage / spread 可複選，預設只有 speed
#
#   ※ 滿弓固定 20 tick，這是客戶端寫死的。曲線只改 0→1 之間的形狀，兩端永遠對齊動畫——
#     設成「40 tick 才滿力道」的話，玩家看到的弓在第 20 tick 就拉滿了，視覺會說謊
#   pellets           一次擊發幾顆（散彈）
#   spread_degrees    以視線為軸的圓錐半頂角（度）。彈著點在圓盤上均勻分布
#   recoil            後座力：每擊發一次散佈額外增加幾度
#                     不寫的話 = spread_degrees × 0.5，所以舊設定檔不改也會有後座力
#   recoil_max        後座力累積的上限（度）。不寫 = max(3, spread_degrees × 3)
#   recoil_recovery   後座力每秒回復幾度。固定速率，不是按比例衰減——
#                     「停火多久才會恢復準度」要能被背下來
#   cooldown_ticks    裝填間隔（20 tick = 1 秒）
#   projectile_speed  彈丸初速（格/tick）
#   gravity           重力（格/tick²），0 = 直線飛行
#   lifetime_ticks    飛多久之後自己消失
#   auto              預留欄位：目前一次右鍵 = 一發，連發靠短 cooldown 達成
#   breaks_blocks     命中的方塊會不會被打掉（只在競技場範圍內生效）
#   trail_particle    飛行時拖的粒子
#   fire_sound        開火音效
#   ammo_capacity     最多帶幾發，也就是 HUD 上 100/120 的分母
#   ammo_per_shot     一次擊發消耗幾發（散彈打 5 顆但只算 1 發，跟 pellets 是兩回事）
#   starting_ammo     開場就配給的量

weapons:
  scrap:
    name: 廢鐵彈
    item: minecraft:iron_nugget
    damage: 20
    splash_radius: 0
    pierce: 0
    knockback: 0.16
    spread_degrees: 1.0
    recoil: 0.6
    recoil_max: 4.0
    recoil_recovery: 6.0
    cooldown_ticks: 18
    projectile_speed: 3.0
    gravity: 0.04
    lifetime_ticks: 120
    breaks_blocks: true
    ammo_capacity: 120
    trail_particle: minecraft:crit
    fire_sound: minecraft:entity.arrow.shoot
    starting_ammo: 60

  mg:
    name: 機槍彈
    item: minecraft:copper_ingot
    damage: 12
    splash_radius: 0
    pierce: 0
    # 每秒近 7 發，單發推得多一點點就會把人黏在牆上動不了
    knockback: 0.08
    spread_degrees: 3.0
    # 連射的代價全在這裡：打滿一梭最後幾發已經散到 9 度
    recoil: 0.9
    recoil_max: 9.0
    recoil_recovery: 7.0
    cooldown_ticks: 3
    projectile_speed: 3.8
    gravity: 0.03
    lifetime_ticks: 80
    auto: true
    breaks_blocks: true
    ammo_capacity: 300
    trail_particle: minecraft:smoke
    fire_sound: minecraft:entity.arrow.shoot
    starting_ammo: 60

  ap:
    name: 穿甲彈
    item: minecraft:iron_ingot
    damage: 20
    splash_radius: 0
    # 完全無視硬度：鋼鐵、黑曜石也是一發一格
    pierce: 1.0
    knockback: 0.16
    spread_degrees: 1.6
    recoil: 0.8
    recoil_max: 4.0
    recoil_recovery: 5.0
    cooldown_ticks: 20
    projectile_speed: 3.4
    gravity: 0.03
    lifetime_ticks: 120
    breaks_blocks: true
    ammo_capacity: 60
    trail_particle: minecraft:enchanted_hit
    fire_sound: minecraft:item.crossbow.shoot

  buck:
    name: 散彈
    item: minecraft:flint
    damage: 11
    splash_radius: 0
    pierce: 0
    # 逐顆結算，貼臉全中等於推 5 次
    knockback: 0.09
    pellets: 5
    spread_degrees: 1.5
    recoil: 0.7
    recoil_max: 4.5
    recoil_recovery: 6.0
    cooldown_ticks: 24
    projectile_speed: 2.6
    gravity: 0.05
    lifetime_ticks: 40
    breaks_blocks: true
    ammo_capacity: 120
    trail_particle: minecraft:crit
    fire_sound: minecraft:entity.firework_rocket.blast

  sniper:
    name: 狙擊彈
    item: minecraft:spectral_arrow
    damage: 52
    splash_radius: 0
    pierce: 0.25
    knockback: 0.45
    spread_degrees: 0
    # 單發極準，但連著開就完全失去狙擊的意義
    recoil: 2.5
    recoil_max: 8.0
    recoil_recovery: 10.0
    cooldown_ticks: 30
    projectile_speed: 5.0
    # 彈道平直：重力極低，背下來的落點不會隨距離大幅改變
    gravity: 0.01
    lifetime_ticks: 160
    breaks_blocks: true
    ammo_capacity: 40
    trail_particle: minecraft:end_rod
    fire_sound: minecraft:item.crossbow.shoot

  he:
    name: 高爆彈
    item: minecraft:tnt
    damage: 38
    splash_radius: 2.5
    pierce: 0
    knockback: 0.7
    # 目前唯一的蓄力武器。慢速拋物線本來就該蓄力：力道決定射程，
    # 拉弓變成測距的動作，而不是多按一個鍵
    #
    # 先只改這一把是刻意的——蓄力的手感只能實測，一次全改的話出問題很難判斷
    # 是機制不對還是某把武器的曲線不對。要推廣到其他武器只要加這兩段設定
    launcher: bow
    charge:
      curve: linear      # 線性最好抓落點
      min_draw: 0.2
      affects: [speed]   # 只影響射程，傷害維持固定，平衡不位移
    spread_degrees: 1.6
    recoil: 1.2
    recoil_max: 5.0
    recoil_recovery: 6.0
    cooldown_ticks: 40
    projectile_speed: 2.4
    gravity: 0.06
    lifetime_ticks: 120
    breaks_blocks: true
    ammo_capacity: 30
    trail_particle: minecraft:flame
    fire_sound: minecraft:entity.generic.explode

  laser:
    name: 雷射
    item: minecraft:amethyst_shard
    damage: 5
    splash_radius: 0
    pierce: 0
    knockback: 0.03
    spread_degrees: 0.3
    # 每秒 10 發，單發加一點點就會在持續射擊時明顯散開
    recoil: 0.25
    recoil_max: 5.0
    recoil_recovery: 5.0
    cooldown_ticks: 2
    # 一 tick 飛 20 格 + 零重力 ＝ 幾乎是即時命中的直線光束
    projectile_speed: 20.0
    gravity: 0
    lifetime_ticks: 6
    auto: true
    breaks_blocks: true
    ammo_capacity: 40
    trail_particle: minecraft:end_rod
    fire_sound: minecraft:block.beacon.power_select

  missile:
    name: 導彈
    item: minecraft:firework_rocket
    damage: 180
    splash_radius: 1.5
    pierce: 0.5
    knockback: 1.5
    spread_degrees: 0
    # 一次一發、80 tick 裝填，後座力沒有意義
    recoil: 0.0
    recoil_max: 0.0
    recoil_recovery: 6.0
    cooldown_ticks: 80
    projectile_speed: 2.0
    gravity: 0
    lifetime_ticks: 200
    breaks_blocks: true
    ammo_capacity: 30
    trail_particle: minecraft:flame
    fire_sound: minecraft:entity.firework_rocket.launch

  drone:
    name: 無人機
    item: minecraft:ender_eye
    damage: 70
    splash_radius: 3.5
    pierce: 0
    knockback: 1.0
    spread_degrees: 0
    recoil: 0.0
    recoil_max: 0.0
    recoil_recovery: 6.0
    cooldown_ticks: 120
    projectile_speed: 1.4
    gravity: 0
    lifetime_ticks: 300
    breaks_blocks: true
    ammo_capacity: 6
    trail_particle: minecraft:portal
    fire_sound: minecraft:entity.generic.explode
