# 要塞對戰 — 商店
#
# 右鍵 NPC 就開店（NPC 在 npcs.yml，商店開在哪棟建築裡在 buildings.yml）。
# 介面是原版的箱子外觀，點一格 = 買一次，展示用的物品拿不走。
#
# 商品欄位
#   name    顯示名稱
#   type    ammo = 給彈藥實物（放副手就是用那把武器）
#           item = 給一般物品（建材之類）
#   price   價格
#   weapon  type = ammo 時指向 weapons.yml 的武器 id；圖示與給出的實物都是它的 item
#   item    type = item 時要給的物品
#   amount  買一次給幾發／幾個
#   lore    說明文字（**補充用**：血量、每元血量、幾發打得破、傷害、射速都由程式從實際數值
#           算出來印在上面，不用也不該手寫進 lore——手寫的會跟設定漂移而且沒人會發現）
#
# 錢從哪來：打怪的賞金（mobs.yml 的 reward）＋ 每輪建造階段的固定收入（duel.yml 的 economy）
#           錢會因為被對手打中而扣（duel.yml 的 economy.damage_penalty）

shops:
  arms_dealer:
    title: 軍火商
    entries:
      # ---- 彈藥 ----
      # 商店不賣「武器」：全場只有一把弓（開場發），副手放什麼彈藥就射什麼，
      # 所以買的一直都是彈藥。買到的就是櫃子上看到的那個物品
      ammo_scrap:
        name: 廢鐵彈 ×60
        type: ammo
        price: 60
        weapon: scrap
        amount: 60

      ammo_mg:
        name: 機槍彈 ×120
        type: ammo
        price: 150
        weapon: mg
        amount: 120

      ammo_ap:
        name: 穿甲彈 ×40
        type: ammo
        price: 200
        weapon: ap
        amount: 40

      ammo_sniper:
        name: 狙擊彈 ×20
        type: ammo
        price: 220
        weapon: sniper
        amount: 20

      ammo_he:
        name: 高爆彈 ×15
        type: ammo
        price: 300
        weapon: he
        amount: 15

      ammo_drone:
        name: 無人機 ×3
        type: ammo
        price: 800
        weapon: drone
        amount: 3

      # ---- 建材 ----
      mat_stone:
        name: 石頭 ×64
        type: item
        price: 100
        item: minecraft:stone
        amount: 64
        lore: 便宜大碗的一般牆體

      # 定價說明：黑曜石 500 血、石頭 15 血，差 33 倍。
      # 舊價 $400/16（= $25/格）等於每塊錢買到 20 血量，石頭只有 9.6——性價比高一倍多，
      # 石頭因此變成嚴格劣勢的選項，建材選擇整個塌縮成「有錢就全蓋黑曜石」。
      #
      # 改成 $800/16（= $50/格）之後兩者的每元血量都在 10 上下。黑曜石保留的優勢換成
      # 「同樣的血量只要放 1/33 的格數」——在 60 秒的建造階段裡，少放方塊本身就是優勢。
      # 穿甲彈的克制關係也更明確了：$5 一發拆掉 $50 一格。
      mat_obsidian:
        name: 黑曜石 ×16
        type: item
        price: 800
        item: minecraft:obsidian
        amount: 16
        lore: 蓋得快、佔得少；但穿甲彈一發一格
