# 要塞對戰 — 商店
#
# 右鍵 NPC 就開店（NPC 在 npcs.yml，商店開在哪棟建築裡在 buildings.yml）。
# 介面是原版的箱子外觀，點一格 = 買一次，展示用的物品拿不走。
#
# 商品欄位
#   name    顯示名稱
#   type    launcher = 給那把弓（全場通用的發射器）
#           ammo     = 給彈藥實物（放副手就是用那把武器）
#           item     = 給一般物品（建材之類），直接發原版物品
#   price   價格
#   weapon  type = ammo 時指向 weapons.yml 的武器 id；圖示與給出的實物都是它的 item
#   item    type = item 時要給的物品
#   amount  買一次給幾發／幾個
#   lore    說明文字（**補充用**：血量、每元血量、幾發打得破、傷害、射速都由程式從實際數值
#           算出來印在上面，不用也不該手寫進 lore——手寫的會跟設定漂移而且沒人會發現）
#
# 錢從哪來：打怪的賞金（mobs.yml 的 reward）＋ 每輪建造階段的固定收入（duel.yml 的 economy）
#           錢會因為被對手打中而扣（duel.yml 的 economy.damage_penalty）

shops:
  arms_dealer:
    title: 軍火商
    entries:
      # ---- 發射器 ----
      # 商店不賣「武器」：全場只有一把弓，副手放什麼彈藥就射什麼，所以買的一直都是彈藥。
      # 弓本身只是那個發射器，開場就發一把，這裡擺一把 $0 的備品是為了兩種情況：
      # 弄丟了（掉進岩漿、手滑丟出去），以及設定檔沒更新到、開場沒拿到弓的舊伺服器
      # type: launcher 而不是 item——item 是給建材用的、直接發原版物品，買到的會是一支
      # 名字叫「弓」的普通弓。發射器要跟開場那把長得一模一樣，所以走武器系統那條路
      buy_bow:
        name: 發射器
        type: launcher
        price: 0
        item: minecraft:bow
        lore: 弄丟了再來拿一把

      # ---- 彈藥 ----
      # 買到的就是櫃子上看到的那個物品，放進副手就是用那把武器
      ammo_scrap:
        name: 廢鐵彈 ×60
        type: ammo
        price: 60
        weapon: scrap
        amount: 60

      ammo_mg:
        name: 機槍彈 ×120
        type: ammo
        price: 150
        weapon: mg
        amount: 120

      ammo_ap:
        name: 穿甲彈 ×40
        type: ammo
        price: 200
        weapon: ap
        amount: 40

      ammo_buck:
        name: 散彈 ×40
        type: ammo
        price: 140
        weapon: buck
        amount: 40
        lore: 一次 6~7 顆、貼臉最痛；打遠的話會散得到處都是

      # $13.75 一發，全場每點傷害最貴的常規彈藥（無人機更貴，但那是清場用的）。
      # 從 20 發降到 16 發：它的問題從來不是傷害效率，是**平直彈道讓遠距離不用學落點**，
      # 所以它的價格買的是「不必練」而不是傷害。定價要照那件事來，不是照傷害來
      ammo_sniper:
        name: 狙擊彈 ×16
        type: ammo
        price: 220
        weapon: sniper
        amount: 16
        lore: 又平又準，射程幾乎不用抬高瞄準；代價是全場最貴的一發

      # $60 一顆，比狙擊彈（$13.75）貴四倍多——它是全場單發最貴的常規彈藥。
      #
      # 定價的依據不是傷害（它沒有傷害），是**對手要花多少時間處理**：一隻 24 血的東西
      # 大概讓對方停下手邊的事十幾秒，而建造階段只有 60 秒。用一輪收入的六分之一
      # 買走對手四分之一個建造階段，這個換算成立但不划算——它本來就該是「我就是想這麼做」
      # 而不是最優解。
      #
      # 一次賣 5 顆是刻意的：買得起一次騷擾，買不起一整場的騷擾
      ammo_egg:
        name: 寶貝蛋 ×5
        type: ammo
        price: 300
        weapon: egg
        amount: 5
        lore: 沒有傷害；落地孵出一兩隻不速之客，丟進對面的院子裡

      ammo_he:
        name: 高爆彈 ×15
        type: ammo
        price: 300
        weapon: he
        amount: 15

      # 舊價 $800/3（$267 一發）在每一種用途上都是虧的：拆黑曜石 $2133 一格、打怪每一種
      # 都收不回本、打玩家換到的罰款上限也才 $100。改成 $800/8（$100 一發）之後它終於有
      # 一個成立的位置——3.5 格的濺射一發清掉整群怪，那是全場唯一做得到這件事的東西
      ammo_drone:
        name: 無人機 ×8
        type: ammo
        price: 800
        weapon: drone
        amount: 8

      # ---- 工具 ----
      # 開場只發一把石鎬，其餘要買。這是有意的：清空背包之後「先買工具還是先買彈藥」
      # 變成第一輪的第一個決定，而兩邊的答案不見得一樣（想快點挖出地堡的人跟想早點
      # 開火壓制的人會分岔）。
      #
      # 價格都壓在一輪收入（$380）以下，湊得出來——工具是門檻不是牆，貴到買不起的話
      # 那個決定就不存在了，所有人都只剩同一條路可以走
      tool_pickaxe:
        name: 鐵鎬
        type: item
        price: 120
        item: minecraft:iron_pickaxe
        lore: 挖石頭快一截；建造階段就是跟時間賽跑

      tool_axe:
        name: 鐵斧
        type: item
        price: 100
        item: minecraft:iron_axe
        lore: 砍樹，也拆得動木造工事

      tool_shovel:
        name: 鐵鏟
        type: item
        price: 80
        item: minecraft:iron_shovel
        lore: 挖土、挖沙；地堡跟壕溝都靠它

      # 就是原版的拴繩，行為完全是原版的（右鍵牽起、再右鍵放開、太遠會斷）。
      # 我們只加一條原版不知道的規則：商人不能離開你的半場，見 NpcBounds。
      #
      # 為什麼要花錢買：能搬動商人是一個**戰術選擇**，不是預設狀態。商人打死就補不到子彈，
      # 所以「花 $40 把他拖到牆後面」跟「省下這筆、賭對面沒空狙他」是兩條都成立的路。
      # 開場就發一條的話那個選擇就不存在了，所有人都會搬。
      #
      # 便宜是因為它只要買一次——它是一次性的門票，不是消耗品
      tool_lead:
        name: 拴繩
        type: item
        price: 40
        item: minecraft:lead
        lore: 右鍵軍火商牽著他走；他不會離開你的半場

      # 熊貓栓不了（原版 Panda.canBeLeashed 寫死回 false），牠只吃竹子——
      # 手上拿著竹子牠就跟著你走，這是搬動熊貓的唯一手段
      tool_bamboo:
        name: 竹子 ×16
        type: item
        price: 60
        item: minecraft:bamboo
        amount: 16
        lore: 拿在手上熊貓就跟著走；開場那 16 根不夠用再來拿

      # ---- 補給 ----
      #
      # 開場清空背包（duel.yml 的 battle.clear_inventory）之後玩家身上一口食物都沒有，
      # 而原版的**自然回血需要飽食度 ≥ 18/20**——所以真正的問題不是餓死，是**受傷不會好**。
      # 中場的北極熊咬一口、摔一跤、被對手擦到一發，那些傷害會一路累積到對戰結束。
      #
      # 餓死本身在 difficulty=easy 下不會發生（飢餓最多掉到 5 顆心就停），但那是伺服器設定，
      # normal 掉到半顆心、hard 會真的餓死。食物在商店裡，這條就不用依賴難度設定了。
      #
      # $80/16 塊（$5 一塊）：一塊回 8 點飽食度，16 塊足夠打完一整場還有剩。
      #
      # 對照一輪收入 $380，這是**開場的 21%**——它不是隨手買的雜項，是第一輪那筆錢裡
      # 真的要挪出來的一格。而且它跟建材直接對撞：同樣 $80 可以換一整疊石頭（64 格）。
      # 「先讓自己活得久，還是先讓牆厚一點」變成開場的第三個決定（另外兩個是工具與彈藥）。
      #
      # 為什麼不再便宜一點：$40 的時候它等於不存在——沒有人會為了 10% 的收入猶豫，
      # 而一個不用想的購買在這張清單上只是多一次點擊
      food_steak:
        name: 熟牛排 ×16
        type: item
        price: 80
        item: minecraft:cooked_beef
        amount: 16
        lore: 飽食度滿了才會自然回血；開場背包是空的，別忘了買

      # 即時回血，跟牛排是兩種東西：牛排是「維持」，金蘋果是「現在就要站起來」。
      #
      # $220 剛好等於一份狙擊彈（20 發），那個對照是刻意的——攻擊階段打到一半撐不住時，
      # 你要的是把自己救回來，還是把對面的牆打穿。兩邊都成立，所以它是個真的決定
      food_golden_apple:
        name: 金蘋果
        type: item
        price: 220
        item: minecraft:golden_apple
        lore: 立刻回血並吸收傷害；打到一半撐不住時的那一口

      # ---- 建材 ----
      #
      # 四種建材的定價是一條**單調的梯子**：越耐打的越省空間，但每塊錢買到的血量越少。
      #
      #   建材    血量/格   每格$    每$1血量
      #   木頭      10      0.78      12.8
      #   石頭      15      1.25      12.0
      #   鐵塊      50      5.00      10.0
      #   黑曜石   500     50.00      10.0
      #
      # 單調是刻意的：任何一種都不能同時「比較便宜」又「比較耐打」，否則它旁邊那種就
      # 直接沒有存在意義。
      #
      # 木頭的 10 血是 duel.yml 的 weapon.block_hp 寫死的，不是硬度算出來的——原版硬度
      # 裡橡木板 2.0 比石頭 1.5 高，照公式算木牆會比石牆耐打，那跟所有人的直覺相反。
      #
      # 錢換血量之外，每一種各有一個買不到的性質，那才是真正要選的東西：
      #
      #   木頭   最便宜的一格 → 同一筆錢圍得最大，適合遮視線、做假結構、擋一兩發
      #   石頭   每塊錢買到最多血量 → 大面積工事的底
      #   鐵塊   血量高、省空間 → 但被穿甲彈一發一格剋死
      #   黑曜石 血量/格最高，而且**爆炸抗性擋得住隕石雨的 TNT**，其餘三種都擋不住
      #
      # 挖方塊已經不掉落了，商店是建材的唯一來源，所以上面就是實際的成本
      mat_wood:
        name: 橡木板 ×64
        type: item
        price: 50
        item: minecraft:oak_planks
        amount: 64
        lore: 最便宜的一格；圍得最大，但擋不了幾發

      mat_stone:
        name: 石頭 ×64
        type: item
        price: 80
        item: minecraft:stone
        amount: 64
        lore: 每塊錢買到最多血量；但要放的格數也最多

      # 鐵塊是穿甲彈唯一剋得動的東西（weapons.yml 的 pierce_blocks），$5/格 對 $5/發，
      # 剛好打平——所以它買到的是時間，不是免疫。對方沒帶穿甲彈的話它硬得像小號黑曜石
      mat_iron:
        name: 鐵塊 ×16
        type: item
        price: 80
        item: minecraft:iron_block
        amount: 16
        lore: 硬、省空間；但穿甲彈一發一格

      # 定價沿革：舊價 $400/16（$25/格）等於每塊錢買到 20 血量，石頭只有 9.6——性價比
      # 高一倍多，石頭因此是嚴格劣勢的選項，建材選擇整個塌縮成「有錢就全蓋黑曜石」。
      # 現在的 $800/16（$50/格）把它壓回梯子的最底層：每塊錢的血量最少，換到的是
      # 「同樣血量只要放 1/33 的格數」以及唯一擋得住隕石雨的爆炸抗性
      mat_obsidian:
        name: 黑曜石 ×16
        type: item
        price: 800
        item: minecraft:obsidian
        amount: 16
        lore: 血量最高、佔得最少；隕石炸不穿的只有它
