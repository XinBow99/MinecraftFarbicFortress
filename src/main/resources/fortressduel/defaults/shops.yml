# 要塞對戰 — 商店
#
# 右鍵 NPC 就開店（NPC 在 npcs.yml，商店開在哪棟建築裡在 buildings.yml）。
# 介面是原版的箱子外觀，點一格 = 買一次，展示用的物品拿不走。
#
# 商品欄位
#   name    顯示名稱
#   type    weapon = 給武器 + 附帶子彈
#           ammo   = 只補子彈（買滿了不會收錢）
#           item   = 給一般物品（建材之類）
#   price   價格
#   weapon  type = weapon/ammo 時指向 weapons.yml 的武器 id
#   item    type = item 時要給的物品；type = weapon 時可省略（用武器綁的物品當圖示）
#   amount  買一次給幾發／幾個
#   lore    說明文字
#
# 錢從哪來：打怪的賞金（mobs.yml 的 reward）＋ 每輪建造階段的固定收入（duel.yml 的 economy）

shops:
  arms_dealer:
    title: 軍火商
    entries:
      # ---- 武器（第一次買才需要，之後補子彈就好）----
      buy_scrap:
        name: 廢鐵彈發射器
        type: weapon
        price: 0
        weapon: scrap
        amount: 60
        lore: 最便宜的萬用彈，什麼都能打

      buy_mg:
        name: 機槍
        type: weapon
        price: 250
        weapon: mg
        amount: 120
        lore: 按得快就打得快，單發弱、精度差

      buy_ap:
        name: 穿甲槍
        type: weapon
        price: 400
        weapon: ap
        amount: 40
        lore: 無視方塊硬度，鋼鐵黑曜石也是一發一格

      buy_sniper:
        name: 狙擊槍
        type: weapon
        price: 500
        weapon: sniper
        amount: 20
        lore: 彈道平直、一發帶走工人

      buy_he:
        name: 高爆炮
        type: weapon
        price: 700
        weapon: he
        amount: 15
        lore: 炸開一片，裝填慢

      buy_drone:
        name: 無人機
        type: weapon
        price: 1500
        weapon: drone
        amount: 3
        lore: 全遊戲最大的一發，慢但擋不太住

      # ---- 補子彈 ----
      ammo_scrap:
        name: 廢鐵彈 ×60
        type: ammo
        price: 60
        weapon: scrap
        amount: 60

      ammo_mg:
        name: 機槍彈 ×120
        type: ammo
        price: 150
        weapon: mg
        amount: 120

      ammo_ap:
        name: 穿甲彈 ×40
        type: ammo
        price: 200
        weapon: ap
        amount: 40

      ammo_sniper:
        name: 狙擊彈 ×20
        type: ammo
        price: 220
        weapon: sniper
        amount: 20

      ammo_he:
        name: 高爆彈 ×15
        type: ammo
        price: 300
        weapon: he
        amount: 15

      ammo_drone:
        name: 無人機 ×3
        type: ammo
        price: 800
        weapon: drone
        amount: 3

      # ---- 建材 ----
      mat_stone:
        name: 石頭 ×64
        type: item
        price: 100
        item: minecraft:stone
        amount: 64
        lore: 硬度 1.5，一般牆體

      mat_obsidian:
        name: 黑曜石 ×16
        type: item
        price: 400
        item: minecraft:obsidian
        amount: 16
        lore: 硬度 50，只有穿甲彈打得動
