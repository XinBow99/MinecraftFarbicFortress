# 要塞對戰 — 怪物技能
#
# 在 mobs.yml 的怪物底下寫 skills: [分身] 就會掛上這裡定義的技能。
#
# 欄位
#   name              顯示名稱
#   type              對應程式裡的實作，決定「做什麼」。內建：
#                       clone         分身：複製自己
#                       summon        召喚：叫出 mobs.yml 裡的另一種怪
#                       break_blocks  啃方塊：把附近**玩家蓋的**東西拆掉
#                                     （max_hardness 可以限制只啃得動哪些材質）
#                       steal         小偷：追人、搶一整疊東西叼在嘴上、然後掉頭就跑
#                       expire        壽命到了就自己消失（不發賞金）
#                       restless      躁動：一停下來就馬上派牠去下一個地方
#                                     （原版沒有「發呆多久」這個設定，見下面「躁動」的說明）
#                       heal          回血
#                       teleport      順移
#                       effect        給自己上一個藥水效果
#   trigger           什麼時候發動：
#                       ON_SPAWN       生成的當下
#                       INTERVAL       每隔 interval_seconds
#                       ON_DAMAGED     每次受傷之後
#                       ON_LOW_HEALTH  血量第一次掉到 health_threshold 以下（整場只觸發一次）
#                       ON_DEATH       死亡的當下
#   chance            觸發時真正發動的機率 0~1
#   cooldown_seconds  冷卻，冷卻中不會再發動
#   once              true = 一隻怪一輩子只發動這個技能一次。跟冷卻是兩回事：冷卻只是
#                     「等一下再來」，而會增加實體數量的技能（分身、召喚）光靠冷卻擋不住
#                     ON_LOW_HEALTH 永遠是 once，不管這裡寫什麼
#   max_uses          一隻怪一輩子最多發動幾次，0 = 不限。once 等於 max_uses: 1
#                     只算**真的發動成功**的次數：啃方塊時附近沒有人造物、分身時深度到頂，
#                     那些回 false 的不會吃掉次數
#                     ※ 任何會生出新實體的技能都該設這個。冷卻只能決定「多久一次」，
#                       決定不了「總共幾次」，而後者才是實體數量的上界
#   interval_seconds  trigger = INTERVAL 時的間隔
#   health_threshold  trigger = ON_LOW_HEALTH 時的血量門檻（佔上限的比例）
#   message           發動時附近玩家看到的訊息，留空 = 不公告
#   params            各 type 自己解讀的參數（見下方各例）
#
# 同一個 type 可以被好幾個技能用不同參數再包一層——例如底下的「分身」與「垂死分裂」
# 都是 clone，只是觸發時機與數量不同。

skills:
  # 死掉才分裂，不是挨打就分裂。
  #
  # 原本掛在 ON_DAMAGED：只要開槍就有機率多出兩隻，於是「打牠」這個動作本身會讓場上的怪
  # 變多。玩家看到的是自己越打越糟，而那跟瞄得準不準無關——一發沒打死就被懲罰。
  # 改成 ON_DEATH 之後因果就對了：**先賺到那筆賞金，才要處理留下來的兩隻。**
  # 分裂從「開火的風險」變成「清場的成本」，而清場是玩家自己選的。
  #
  # 這也順便讓數量有上界：每隻怪最多貢獻一次分裂，一群 8~12 隻全殺完平均多出
  # (8~12) × 0.25 × 2 ≈ 4~6 隻，而牠們自己不會再裂（inherit_skills: false）。
  #
  # inherit_skills: false 仍然必要——分身也帶技能的話會變成 1→2→4 的樹（有深度上限 2 擋著，
  # 所以是 7 隻封頂，但那仍然是一棵樹而不是「分裂一次」）。
  #
  # 順帶一提，不繼承技能的分身也不會被登記進技能引擎，所以**打死分身沒有賞金**——
  # 分裂因此不會變成印鈔機。
  #
  # 沒有 once 與 cooldown_seconds：ON_DEATH 一輩子本來就只有一次，寫了只是看起來像在防什麼。
  分身:
    name: 分身
    type: clone
    trigger: ON_DEATH
    chance: 0.25
    message: "§d它裂成了兩隻。"
    params:
      count: 2
      # 分身的血量 = 本體血量上限 × health_ratio
      health_ratio: 0.5
      scale_ratio: 0.8
      radius: 3
      # false = 分身不帶技能，所以它不會再分裂
      inherit_skills: false

  # 跟「分身」同樣是死亡分裂，差別在數量與強度：這邊是三隻但只有四分之一血，
  # 而且必定發生。給血厚、單隻很有存在感的怪用（野牛群），死掉那一下才有畫面。
  垂死分裂:
    name: 垂死分裂
    type: clone
    trigger: ON_DEATH
    chance: 1.0
    message: "§d它裂開了。"
    params:
      count: 3
      health_ratio: 0.25
      scale_ratio: 0.6
      radius: 2
      # 死亡分裂不繼承技能，否則一隻怪可以無限裂下去
      inherit_skills: false

  # max_uses: 2 是這個技能唯一擋得住增殖的東西，冷卻擋不住。
  #
  # 原本是無限的：每 40 秒（20 秒間隔 × 50% 機率）吐出一整群 8~12 隻，而且召喚出來的怪走
  # 完整的 spawnPack，也就是**牠們有賞金**（分身沒有，這兩條路不一樣）。一群值 $280，
  # 巨獸本體才 $520，於是最優解變成「不要殺牠」——站在旁邊收割，活得越久賺越多，
  # 沒有任何上限。順帶一提巨獸只要九發狙擊就死，所以那完全是玩家自己選的。
  #
  # 上限 2 而不是 once：召喚兩次讀得出「牠會一直叫人」這件事，只召一次就只是個開場動畫。
  # 兩次的代價是最多多出 20 隻實體與 $560 賞金，換算成時間是玩家得在中場待約 80 秒——
  # 那 80 秒是暴露在對手火線下的，所以它是一個有成本的選擇，不是印鈔機。
  召喚蟲群:
    name: 召喚野獸
    type: summon
    trigger: INTERVAL
    interval_seconds: 20
    chance: 0.5
    cooldown_seconds: 20
    max_uses: 2
    message: "§d它召來了一批野獸。"
    params:
      mob: swarm
      radius: 5

  # 只拆「跟開場前不一樣」的格子——玩家蓋的牆、平台、柵欄，天然地形與框線都不動。
  # 不然這隻怪會在中場自己挖出一個坑，看起來只是壞掉，而它的定位是「對人造物有破壞慾」。
  #
  # 拆掉的格子照樣進快照的還原路徑（對戰結束會補回來），而且不掉落物品——牆被拆開不該
  # 順便變成建材。
  #
  # 每 3 秒一次、一次最多 3 格：一隻的話大約每分鐘 60 格，四隻圍上來就是每分鐘 240 格。
  # 那個速度拆得動一面石牆但拆不動黑曜石堡壘，所以它是壓力不是死刑
  啃食:
    name: 啃食
    type: break_blocks
    trigger: INTERVAL
    interval_seconds: 3
    params:
      radius: 3
      count: 3

  # 跟「啃食」同一個 type，差別在 max_hardness：老鼠只咬得動軟的東西。
  #
  # 2.0 這個門檻直接切在建材的價格階梯上（硬度就是 weapons.yml 算方塊血量用的那個數字）：
  #   泥土 0.5、石頭 1.5、橡木板 2.0  → 啃得穿
  #   鐵塊 5.0、黑曜石 50            → 完全免疫，牠們會在牆上爬半天卻咬不下一格
  # 所以這個事件是在問「你的外牆是拿最便宜的板子圍的嗎」，而不是單純再扣一次血量。
  # 這也是唯一一個「貴的建材買到的是免疫、不是更多血量」的地方。
  #
  # radius 2 而不是 3：牠們啃的是自己正貼著的那面牆。範圍再大就會隔著空氣咬到牆的另一側，
  # 那跟「沿著牆往上爬」的畫面對不起來——爬上去這件事就沒有意義了。
  #
  # 每 4 秒 1 格，一群 8~12 隻 ≈ 每分鐘 150 格（前提是全部都咬得動）。比悅靈的 240 慢，
  # 但牠們是生在你自己的陣地裡、而且會爬上牆頂，所以感受上更急。
  鼠嚙:
    name: 鼠嚙
    type: break_blocks
    trigger: INTERVAL
    interval_seconds: 4
    params:
      radius: 2
      count: 1
      max_hardness: 2.0

  # 治「牠停在一個定點，過一下才動一下」。
  #
  # 原版沒有「發呆多久」這個設定——那個停頓寫死在各自的 AI 裡，而且蜜蜂與悅靈還是兩套
  # 完全不同的系統（一個用 goal、一個用 brain）。所以這裡不去改牠們什麼時候停下來，
  # 而是**在牠停下來的那一刻就給牠下一個目的地**：走牠自己的導航，路徑與飛行姿態都還是
  # 原版的，看起來就是這隻生物比較好動。
  #
  # 間隔 1 秒不是「每秒強制換方向」：導航還在跑就什麼都不做（回 false、不進冷卻），
  # 所以它只在真的閒下來的那一刻插手。
  #
  # vertical 3 是給會飛的：只在水平面上換點的話牠會像貼著一層看不見的地板滑來滑去
  躁動:
    name: 躁動
    type: restless
    trigger: INTERVAL
    interval_seconds: 1
    params:
      radius: 10
      vertical: 3
      speed: 1.0

  再生:
    name: 再生
    type: heal
    trigger: INTERVAL
    interval_seconds: 5
    params:
      # 固定值與比例可以同時寫，會相加
      ratio: 0.05

  垂死狂暴:
    name: 垂死狂暴
    type: effect
    trigger: ON_LOW_HEALTH
    health_threshold: 0.3
    message: "§c它狂暴了！"
    params:
      effect: minecraft:speed
      duration_seconds: 15
      amplifier: 1

  閃現:
    name: 閃現
    type: teleport
    trigger: ON_DAMAGED
    chance: 0.3
    cooldown_seconds: 4
    params:
      radius: 8
      # true = 往攻擊者身邊跳（追擊）；false = 隨機跳開（閃避）
      toward_attacker: false

  瞬移突進:
    name: 瞬移突進
    type: teleport
    trigger: INTERVAL
    interval_seconds: 3
    params:
      radius: 12
      toward_attacker: true

  # 小偷：追人 → 搶走一整疊東西叼在嘴上 → 掉頭就跑，被打死才吐出來。
  #
  # 三件事是原版幫我們做的，所以這個技能比看起來小很多：
  #   叼在嘴上   搶到的放進主手，而狐狸本來就會把主手的東西渲染在嘴裡
  #   死了才掉   掉落機率設成 1.0，剩下的交給原版的死亡掉落
  #   整疊拿走   直接搬整個 ItemStack，不用自己算數量
  #
  # 但它會**把原版掛在那隻怪身上的行為整組拔掉**：狐狸白天會睡覺、會躲玩家、會去撿地上的
  # 東西、會撲雞，那四條每一條都在跟這個技能搶導航，而「躲玩家」跟「追玩家」更是直接對衝。
  # 所以掛了這個技能的怪就**不再是原版的那隻生物**了，只剩外觀。別把它掛到需要保留原本
  # 行為的怪身上。
  #
  # interval 1 秒：導航本來就會自己走完整條路徑，重下的意義只是「目標動了要改道」，
  # 而人一秒跑不了多遠。
  #
  # params
  #   speed   導航速度倍率。1.3 讓牠追得上走路的玩家，但衝刺跑得掉
  #   range   看得到幾格內的玩家
  #   reach   多近算搶得到
  #   flee    逃跑時一次挑多遠的落點
  小偷:
    name: 小偷
    type: steal
    trigger: INTERVAL
    interval_seconds: 1
    params:
      speed: 1.3
      range: 24
      reach: 1.8
      flee: 16

  # 壽命到了就自己消失。
  #
  # 給「一陣風式」的事件用：鼠疫那種一次放十幾隻、目的是逼你在幾秒內做決定的怪，留著只會
  # 變成打掃工作——而打掃不是遊戲。有了它，事件的張力落在那二十秒裡，而不是落在
  # 「等一下要花多久把牠們清乾淨」。
  #
  # 不發賞金（走 discard 不走 kill）：牠不是被殺的，不然只要站著等就有錢拿。
  #
  # interval 1 秒只是「多久問一次」，真正的計時看的是實體自己的年齡——INTERVAL 的第一次
  # 觸發是立刻發生的，拿它當計時器的話怪一生出來就死了
  短命:
    name: 短命
    type: expire
    trigger: INTERVAL
    interval_seconds: 1
    params:
      seconds: 20
