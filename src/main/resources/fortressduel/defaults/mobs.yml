# 要塞對戰 — 怪物
#
# 不註冊新的實體型別，而是拿一個原版實體當底（entity）再套上這裡的數值，
# 所以加一種怪不用寫任何 Java，客戶端也不用裝 mod。
# 血量沿用網頁版的 MONSTER_KINDS，賞金那一欄拿掉了（MC 版沒有經濟系統）。
#
# 欄位
#   name           顯示名稱（會掛成實體的自訂名字）
#   entity         拿哪個原版實體當底
#   entities       多寫幾種的話，**每一隻各自隨機抽一種**（混合族群）。跟 entity 二擇一，
#                  兩個都寫時 entities 優先。數值仍然整群共用——混的是外觀與原版行為，不是強度
#                  兩種寫法：
#                    entities: [minecraft:rabbit, minecraft:fox]   等機率
#                    entities:                                     指定權重（數字越大越常出現）
#                      minecraft:rabbit: 6
#                      minecraft:fox: 1
#   health         血量上限
#   attack_damage  攻擊力。只有真的會攻擊的實體吃得到——被動生物永遠用不到，中立生物
#                  只有在你先打了牠之後才用得到
#   movement_speed 移動速度（原版殭屍約 0.23）。**會飛的生物不吃這一欄**，見下面 flying_speed
#   flying_speed   飛行速度；0（預設）= 不動牠原本的值。
#                  悅靈、蜜蜂、蝙蝠走的是飛行移動控制，速度來源是另一個屬性（FLYING_SPEED），
#                  所以在牠們身上調 movement_speed 不會報錯、但也什麼都不會發生。
#                  參考值：悅靈原版 0.1
#   scale          體型倍率
#   pack_min/max   一次降臨幾隻
#   weight         抽籤權重，0 = 只能被突發事件指名叫出來
#   skills         掛在牠身上的技能 id（定義在 skills.yml）
#
# 為什麼中場的怪不能是敵對生物：
#   怪物生在中場，賞金是唯一的競爭性收入。用會追人的敵對生物的話，牠們會走向其中一名玩家，
#   那一側就變得比較好打——誰拿到賞金變成「怪剛好往誰那邊走」決定的，而不是誰瞄得準。
#   （玩家本來就進不去中場，見 duel.yml 的 arena.neutral_fraction）
#
#   被動與中立都可以，敵對不行。中立生物（蜜蜂、狐狸、北極熊）平常不理人，只有你打了牠
#   才會追過來——那是你自己選的，跟「它剛好生在誰旁邊」不一樣。敵對生物則是一生出來就
#   往人走，那一側立刻比較好打，跟誰瞄得準無關。
#
#   注意 duel.yml 的 arena.creatures_roam_freely 預設是 true，也就是**怪追得到玩家**
#   （之前三區塊限制會把牠們擋在中場）。所以上面那條「敵對不行」現在是唯一的防線了。
#
#   唯一的例外是 vermin（黑鼠），牠是給鼠疫事件用的，刻意生在雙方自己的陣地裡。
#
# 賞金的定價原則：**每一點血值 1.1~1.4 元**，整群的總賞金落在 $270~$700。
#
#   野獸群   28 × 8~12 = $224~336   （每點血 1.40：混合族群，個體大小差很多、難統一瞄）
#   野牛群  140 × 4~6  = $560~840   （1.08）
#   蝙蝠群   90 × 2~4  = $180~360   （1.29：會飛，也難瞄）
#   漂鳥     32 × 15~20 = $480~640   （1.07：一發就死，難的是打中）
#   難民     70 × 5     = $350       （1.27）
#   黑鼠     35 × 8~12  = $280~420   （1.17，雙方各一份，權重 0）
#   悅靈     35 × 3~5   = $105~175   （1.17，整群刻意遠低於區間，理由見它自己的註解）
#   巨獸    520 × 1     = $520       （1.16，權重 0，只有 ender 事件叫得出來）
#
# 為什麼要拉近：舊值的流浪商隊整群 $1000、隱藏副本只有 $250，差四倍，而抽到哪個事件
# 純粹是運氣。事件每 150 秒一次（約一輪半），對照每輪固定收入 $380——一次抽籤就決定誰多拿了
# 快兩輪的錢，那不是玩家能操作的東西。拉近之後最大最小差 2.6 倍。
#
# **每點血的數字比整群總額重要**：它決定「打這隻划不划算」，而整群總額只決定這個事件
# 值多少。悅靈就是靠這個分開處理的——每點血守住 1.17，但整群刻意只有 $105~175，
# 因為殺它的回報本來就不是錢。
#
# 彈藥成本相對賞金可以忽略（廢鐵彈打一隻漂鳥 2 發 $2，拿 $32），所以打怪的成本
# 從來不是錢，是時間與暴露——你在中場的那段時間，對手正在拆你的牆。
#
# 尚未實作：怪物還沒有「主動去打核心」的 AI，牠們走的是原版的目標選擇。
# 等那個做出來才會有對應的設定欄位——現在沒有欄位，就是真的沒有這個行為。

# 一場對戰的場上最多同時幾隻怪；0 = 不限制。
#
# 這是**效能的煞車，不是平衡的旋鈕**。加怪的來源有三個——突發事件、寶貝蛋、以及會召喚
# 與會分裂的技能——而它們互相不知道對方生了多少。連續幾個生怪事件疊在一起，數量是相加
# 的，沒有任何一條規則會把它收斂回來。
#
# 超過的時候收掉**最老的那幾隻**，不是隨機挑：老的多半是前幾波留下來、卡在角落沒人理的，
# 那正是純粹在吃效能的部分；而剛降臨的那一波是玩家現在正在應付的東西。
#
# 收掉的怪**不發賞金**（走 discard 不走 kill），不然這條規則等於系統自己印錢。
# 牠們會冒一陣煙，看起來像原版的自然消失
limits:
  max_alive: 30

mobs:
  # 混合族群：每一隻各自從 entities 依權重抽一種原版實體當底，所以一群裡兔子、穿山甲、
  # 狐狸、駱駝、北極熊都有。數值（血量、攻擊、體型）仍然整群共用——這裡混的是外觀與
  # 原版行為，不是強度。
  #
  # 權重不是等的，因為混進來的原版行為不對等：
  #
  #   狐狸會獵捕兔子（Fox 的 NearestAttackableTargetGoal 吃 Animal）。等權重時一群裡
  #   會有兩三隻狐狸，兔子被吃到剩不下幾隻——玩家還沒瞄準賞金就自己蒸發了。壓到 1/14
  #   之後牠變成偶爾出現的點綴：看得到牠追兔子，但那是風景不是損失。
  #
  #   北極熊被打會還手、身邊有幼熊時會主動攻擊玩家，而 creatures_roam_freely 開著時牠
  #   真的追得到你（8 攻擊力對 20 血的玩家很有感）。所以也不要太多。
  #
  # 兔子 6 / 穿山甲 3 / 駱駝 2 / 北極熊 2 / 山貓 1，總和 14——
  # 一群 8~12 隻裡大約 4~5 隻兔子、0~1 隻山貓。
  #
  # 這裡本來是狐狸，換掉是因為狐狸現在有自己的事件（小偷狐狸）——同一種生物在場上代表
  # 兩件完全不同的事，玩家會分不出哪一隻會偷東西
  swarm:
    name: 野獸群
    entities:
      minecraft:rabbit: 6
      minecraft:armadillo: 3
      minecraft:camel: 2
      minecraft:polar_bear: 2
      minecraft:ocelot: 1
    health: 20
    attack_damage: 2
    movement_speed: 0.3
    scale: 1.0
    pack_min: 8
    pack_max: 12
    weight: 3.0
    reward: 28
    skills: [分身]

  ground:
    name: 野牛群
    entity: minecraft:cow
    health: 130
    attack_damage: 4
    movement_speed: 0.18
    scale: 1.2
    pack_min: 4
    pack_max: 6
    weight: 3.0
    reward: 140
    skills: [垂死分裂]

  sky:
    name: 蝙蝠群
    entity: minecraft:bat
    health: 70
    attack_damage: 3
    movement_speed: 0.4
    scale: 1.0
    pack_min: 2
    pack_max: 4
    weight: 2.0
    reward: 90

  # 蜜蜂是**中立**的：被打會反擊並且螫人（螫完自己也會死）。這跟這份檔案原本「只選完全
  # 被動」的規則相反，而且 creatures_roam_freely 開著時牠真的追得過來——所以「打不打牠」
  # 變成一個要想一下的決定，而不是白拿的賞金。這是刻意的。
  #
  # 體型 1.5 倍：蜜蜂的原版碰撞箱很小，不放大的話這一群的難度不是「飛得飄」而是「看不到」
  #
  # 從 3~5 隻 130 血改成 15~20 隻 30 血，整群賞金 $480~800 → $480~640（幾乎沒動）。
  # 換掉的是**難度的來源**：舊的是「打得中但要打很久」（3 隻各挨三發狙擊），
  # 新的是「一發就死但你打不中」——一群又快又小又會亂飄的目標，考的是預判不是耐心。
  # 每隻 32 元 ÷ 30 血 = 1.07，仍然在這份檔案 1.1~1.4 那條線附近。
  #
  # 20 隻不會是效能問題：跟鼠疫的 8~12 隻同量級，而寶貝蛋一顆也才 1~2 隻
  drift:
    name: 漂鳥
    entity: minecraft:bee
    health: 30
    attack_damage: 3
    # 對蜜蜂無效（會飛的走 flying_speed），留著是因為改天換成地面生物才有意義
    movement_speed: 0.45
    # 蜜蜂原版就有 0.6，所以要「更快」得往上加而不是隨便填一個數字。
    # 0.9 是 1.5 倍，剛好快到讓「預判提前量」變成必要而不只是加分
    flying_speed: 0.9
    scale: 1.5
    pack_min: 15
    pack_max: 20
    weight: 2.0
    reward: 32
    skills: [閃現, 躁動]

  refugee:
    name: 難民
    entity: minecraft:villager
    health: 55
    attack_damage: 5
    movement_speed: 0.35
    scale: 1.0
    pack_min: 5
    pack_max: 5
    weight: 1.0
    reward: 70

  # 它對人沒興趣，但會把**玩家蓋的方塊**一格一格啃掉（skills 的「啃食」）。天然地形與
  # 框線不動——只吃跟開場前不一樣的格子，所以它咬的一定是有人蓋上去的東西。
  #
  # 3~5 隻而不是 1~2：一隻每分鐘啃 60 格，那只是背景噪音；四隻同時圍著一面牆才會逼你
  # 停下手上的事去處理。
  #
  # 血量 30（跟黑鼠一樣），不是原本的 140。
  #
  # 140 那版是照「狙擊剛好三發」訂的，而它同時會飛、會閃現、現在還加了躁動——
  # 三個閃避手段疊在一起，要對同一隻連中三發太吃運氣，實際體感是「打不完」而不是「難打」。
  # 難度應該來自**瞄準**，不是來自牠有多少血可以磨。降到 30 之後多數武器一發一隻，
  # 它的威脅完全回到「你的牆正在被啃」這件事上，而那本來就是這隻怪存在的理由。
  #
  # 現在：狙擊 1 發、廢鐵彈 2 發、機槍 3 發、散彈 1 發、高爆 1 發。
  #
  # 「再生」留著但幾乎沒有作用了（每 5 秒回 1.5 點，而任何一發都能秒殺）。沒有拿掉是因為
  # 它在**濺射打不死的邊緣個體**身上還有意義，而且不會傷害到任何東西。
  #
  # 賞金 35 跟著血量一起降（每點血 1.17）。維持 140 的話會變成 4.67——用一發廢鐵彈換 $140，
  # 直接是全場報酬率最高的行為，其他所有怪都沒有理由再打了。
  #
  # 代價是整群只剩 $105~175，遠低於這份檔案 $270~700 的區間。這是刻意接受的：
  # 這隻怪的回報從來就不是賞金，是「牆停止減少」。要把錢補回來就提高數量而不是賞金
  # （6~10 隻 → $210~350），但那會讓啃牆速度也跟著翻倍，要一起想。
  #
  # 會飛（悅靈）是刻意的：牆的上緣、屋頂、懸空的結構都躲不掉，所以「蓋高一點」不是解法。
  # 難瞄是它的第二個防禦手段（第一個是會飛）。悅靈的原版飛行速度只有 0.1，
  # 而 movement_speed 對會飛的生物完全沒有作用——所以在這一版之前，那個 0.5 是白寫的，
  # 它其實一直用原版速度在飄。flying_speed: 0.32 是真的把它加速到三倍多。
  #
  # 為什麼可以加這麼多而不失控：它不攻擊玩家（allay 沒有攻擊行為，下面的 attack_damage
  # 對它是死的），所以速度只影響「難不難打中」，不影響「有多痛」。它的威脅一直都是
  # 你的牆在少，不是你的血在少。
  #
  # 它身上的「閃現」（挨打 30% 機率隨機跳開 8 格）現在幾乎不會觸發——多數武器一發就殺掉了，
  # 沒有第二發可以閃。留著是因為濺射打不死的邊緣個體還用得到，而且它本來就是閃避不是續命
  eclipse:
    name: 悅靈
    entity: minecraft:allay
    health: 30
    attack_damage: 6
    movement_speed: 0.5
    flying_speed: 0.32
    scale: 1.4
    pack_min: 3
    pack_max: 5
    weight: 1.0
    reward: 35
    skills: [閃現, 再生, 啃食, 躁動]

  # 鼠疫事件專用，是這份檔案裡**唯一敵對**的一種。
  #
  # 其餘的怪生在中場，是雙方要搶的收入；這種生在雙方自己的熊貓圈旁邊、會主動咬玩家，
  # 是你家裡的麻煩。兩邊同時放所以起點是對稱的——但 creatures_roam_freely 開著時牠們會
  # 追著人跑，所以真的會有幾隻晃到對面去，那是可以接受的浮動。
  #
  # 為什麼底是洞穴蜘蛛而不是蠹蟲：這個事件的核心畫面是**沿著牆往上爬**，而原版只有蜘蛛類
  # 有爬牆行為（蠹蟲、螞蟻蟲都只會在地面跑）。26.2 也沒有加入任何鼠類或會爬牆的新生物——
  # 該版唯一的新生物是硫磺立方怪，是個立方體。所以這裡拿爬牆行為換掉了外觀的相似度：
  # 縮到 0.6 之後體型接近老鼠，而且「牆爬不掉牠們」這件事真的會發生。
  #
  # 順帶一提洞穴蜘蛛咬人會中毒，這對一個叫「鼠疫」的事件剛好是對的——不是設計出來的，
  # 是原版本來就有的，但既然對得上就留著。
  #
  # 血量壓低（30）是刻意的：它要能被清掉，而且清得完。清不完的話這個事件就不是「處理麻煩」
  # 而是「這一輪你別想蓋東西了」，那太重了。
  #
  # 8~12 隻（原本 5~8）是為了「一大群」那個字面：牠們單隻很弱，威脅完全來自數量與
  # 同時啃好幾面牆。賞金 35 × 8~12 = $280~420，仍然在這份檔案的 $270~700 區間裡。
  vermin:
    name: 黑鼠
    entity: minecraft:cave_spider
    health: 30
    attack_damage: 2
    movement_speed: 0.3
    # 0.6：洞穴蜘蛛原本就比一般蜘蛛小，再壓一次之後貼在牆上看起來就是一團老鼠
    scale: 0.6
    pack_min: 8
    pack_max: 12
    # 0 = 不進一般抽籤，只由突發事件叫出來
    weight: 0
    reward: 35
    # 短命：二十秒後自己消失。牠們是一陣風，不是一份打掃工作——
    # 沒有這條的話玩家清完牆上那十幾隻的時間會比事件本身還長
    skills: [鼠嚙, 短命]

  # 寶貝蛋（weapons.yml 的 egg）孵出來的東西。不由突發事件叫，只有那顆蛋放得出來。
  #
  # 選種的唯一硬條件是**不能被太陽燒掉**：時間鎖在中午，殭屍、骷髏、屍殼以外的不死族
  # 一生出來就會起火燒成灰，那顆 $300 的蛋等於丟進水裡。以下六種在白天都活得好好的。
  #
  #   苦力怕   會爆炸，而爆炸真的會炸掉對方蓋的牆——這是六種裡唯一有實質破壞力的
  #   女巫     丟藥水，減速與中毒，煩但不致命
  #   衛道士   拿斧頭追著砍，跑得快
  #   洞穴蜘蛛 會爬牆，跟鼠疫同一個底
  #   蠹蟲     鑽方塊、數量感強
  #   屍殼     沙漠殭屍，不怕太陽（一般殭屍會燒起來，這是唯一能用的殭屍）
  #
  # 血量 100，不是原版的二十幾。
  #
  # 原版血量在這個遊戲裡沒有意義：這裡的武器是照「幾發破一格牆」調的，不是照打生物調的。
  # 苦力怕原版 20 血，而最便宜的廢鐵彈一發就有 20 傷害——那等於對手花 $60 丟過來的東西，
  # 你花 $1 一發就清掉，這個道具直接不存在。mobs.yml 裡每一種怪都是這個理由才要改血量。
  #
  # 100 的斷點（對照 duel.yml 的熊貓也是 100，好記）：
  #   廢鐵彈 5 發、機槍 9 發、狙擊 2 發、高爆 3 發、散彈 1 發（貼臉全中）、無人機 2 發
  # 也就是說用最便宜的彈藥清一隻要五發，那是**十幾秒**——而那十幾秒對手正在蓋牆或瞄準。
  # 這個道具賣的一直是時間，血量就是時間的單位。
  #
  # 傷害維持 3（遠低於這些生物的原版值）是刻意的另一半：它耐打但不太痛。
  # 目的是逼你停下手邊的事去處理，不是把你打死——會死人的話它就變成一件武器，
  # 而不是一個騷擾道具了。
  #
  # 賞金 0 是重點：這是全檔案唯一一種殺了不給錢的怪。給錢的話這顆蛋就變成「付 $300
  # 送對手一筆收入」，玩家算得出來，然後就沒有人會買它了。
  #
  # 苦力怕值得單獨講：它炸得掉牆，所以這顆蛋不是純心理戰——丟得準的話真的會拆掉東西。
  # 熊貓仍然安全（熊貓只吃玩家的攻擊，苦力怕沒有 owner），所以它拆得了牆但決定不了勝負。
  pest:
    name: 惡作劇
    entities:
      minecraft:creeper: 3
      minecraft:cave_spider: 3
      minecraft:silverfish: 3
      minecraft:witch: 2
      minecraft:vindicator: 2
      minecraft:husk: 2
    health: 100
    attack_damage: 3
    movement_speed: 0.3
    scale: 1.0
    pack_min: 1
    pack_max: 1
    # 0 = 不進突發事件的抽籤，只有寶貝蛋放得出來
    weight: 0
    # 0 = 殺了不給錢。見上面的說明
    reward: 0

  boss:
    name: 巨獸
    entity: minecraft:sniffer
    health: 450
    attack_damage: 8
    movement_speed: 0.3
    scale: 1.6
    pack_min: 1
    pack_max: 1
    # 0 = 不進一般抽籤，只由突發事件叫出來
    weight: 0
    # 對應網頁版終界怪物的順移移動、吃小怪長大、殘血狂暴
    reward: 520
    skills: [瞬移突進, 召喚蟲群, 垂死狂暴]

  # 小偷狐狸。**牠不是普通的狐狸**：小偷技能會把原版的行為整組拔掉（見 skills.yml），
  # 所以牠不睡覺、不躲人、不撿地上的東西，只會追你、搶你一整疊東西、然後跑掉。
  #
  # 血量刻意低（30，兩發廢鐵彈）：這個事件的出口就是「殺了牠拿回來」，厚血會把它從
  # 一場鬧劇變成一場酷刑。而牠跑得比玩家走路快一點但比衝刺慢，所以追得回來但要花力氣。
  #
  # 攻擊力 0：牠是小偷不是殺手。會痛的話玩家的正確反應會變成「躲遠一點」，
  # 而這個事件要的正好相反——牠必須讓你想追上去
  fox_thief:
    name: 小偷狐狸
    entity: minecraft:fox
    health: 30
    attack_damage: 0
    movement_speed: 0.42
    scale: 1.0
    pack_min: 3
    pack_max: 4
    weight: 0
    reward: 20
    skills: [小偷]
