# 要塞對戰 — 怪物
#
# 不註冊新的實體型別，而是拿一個原版實體當底（entity）再套上這裡的數值，
# 所以加一種怪不用寫任何 Java，客戶端也不用裝 mod。
# 血量沿用網頁版的 MONSTER_KINDS，賞金那一欄拿掉了（MC 版沒有經濟系統）。
#
# 欄位
#   name           顯示名稱（會掛成實體的自訂名字）
#   entity         拿哪個原版實體當底
#   health         血量上限
#   attack_damage  攻擊力。**目前全部是被動生物，所以這一欄實際上沒有作用**，留著是因為
#                  換回會攻擊的實體時它立刻就有意義（見下面「為什麼全是被動生物」）
#   movement_speed 移動速度（原版殭屍約 0.23）
#   scale          體型倍率
#   pack_min/max   一次降臨幾隻
#   weight         抽籤權重，0 = 只能被突發事件指名叫出來
#   skills         掛在牠身上的技能 id（定義在 skills.yml）
#
# 為什麼全是被動生物：
#   怪物生在中場，賞金是唯一的競爭性收入。用會追人的敵對生物的話，牠們會走向其中一名玩家，
#   那一側就變得比較好打——誰拿到賞金變成「怪剛好往誰那邊走」決定的，而不是誰瞄得準。
#   換成被動生物之後牠們只會在中場遊蕩，雙方都得隔著中場遠程射，這才是公平的競爭。
#   （玩家本來就進不去中場，見 duel.yml 的 arena.neutral_fraction）
#
#   選的都是**完全被動**、連被打都不會反擊的實體。蜜蜂、鐵傀儡、羊駝那類「中立」生物
#   被攻擊之後會轉為敵對並開始追人，等於把問題繞一圈又帶回來。
#
# 賞金的定價原則：**每一點血值 1.1~1.4 元**，整群的總賞金落在 $270~$700。
#
#   鼠群     28 × 8~12 = $224~336   （每點血 1.40：目標小、難瞄，給一點溢價）
#   野牛群  140 × 4~6  = $560~840   （1.08）
#   蝙蝠群   90 × 2~4  = $180~360   （1.29：會飛，也難瞄）
#   流浪商隊 160 × 3~5 = $480~800   （1.23）
#   難民     70 × 5    = $350       （1.27）
#   悅靈    180 × 1~2  = $180~360   （1.13）
#   巨獸    520 × 1    = $520       （1.16，權重 0，只有 ender 事件叫得出來）
#
# 為什麼要拉近：舊值的流浪商隊整群 $1000、隱藏副本只有 $250，差四倍，而抽到哪個事件
# 純粹是運氣。事件每 120 秒一次剛好一輪，對照每輪固定收入 $380——一次抽籤就決定誰多拿了
# 兩輪的錢，那不是玩家能操作的東西。拉近之後最大最小差 2.6 倍。
#
# 彈藥成本相對賞金可以忽略（廢鐵彈打一隻流浪商人 7 發 $7，拿 $160），所以打怪的成本
# 從來不是錢，是時間與暴露——你在中場的那段時間，對手正在拆你的牆。
#
# 尚未實作：怪物還沒有「主動去打核心」的 AI，牠們走的是原版的目標選擇。
# 等那個做出來才會有對應的設定欄位——現在沒有欄位，就是真的沒有這個行為。

mobs:
  swarm:
    name: 鼠群
    entity: minecraft:rabbit
    health: 20
    attack_damage: 2
    movement_speed: 0.3
    scale: 1.0
    pack_min: 8
    pack_max: 12
    weight: 3.0
    reward: 28
    skills: [分身]

  ground:
    name: 野牛群
    entity: minecraft:cow
    health: 130
    attack_damage: 4
    movement_speed: 0.18
    scale: 1.2
    pack_min: 4
    pack_max: 6
    weight: 3.0
    reward: 140
    skills: [垂死分裂]

  sky:
    name: 蝙蝠群
    entity: minecraft:bat
    health: 70
    attack_damage: 3
    movement_speed: 0.4
    scale: 1.0
    pack_min: 2
    pack_max: 4
    weight: 2.0
    reward: 90

  drift:
    name: 流浪商隊
    entity: minecraft:wandering_trader
    health: 130
    attack_damage: 3
    movement_speed: 0.45
    scale: 1.5
    pack_min: 3
    pack_max: 5
    weight: 2.0
    reward: 160
    skills: [閃現]

  refugee:
    name: 難民
    entity: minecraft:villager
    health: 55
    attack_damage: 5
    movement_speed: 0.35
    scale: 1.0
    pack_min: 5
    pack_max: 5
    weight: 1.0
    reward: 70

  eclipse:
    name: 悅靈
    entity: minecraft:allay
    health: 160
    attack_damage: 6
    movement_speed: 0.5
    scale: 1.4
    pack_min: 1
    pack_max: 2
    weight: 1.0
    reward: 180
    skills: [閃現, 再生]

  # 鼠疫事件專用，是這份檔案裡**唯一敵對**的一種。
  #
  # 其餘的怪生在中場、完全被動，是雙方要搶的收入；這種生在雙方自己的熊貓圈旁邊、會主動
  # 咬玩家，是你家裡的麻煩。兩邊同時放所以仍然對稱，而三區塊限制會把牠們鎖在生成的那一側。
  #
  # 血量壓低（30）是刻意的：它要能被清掉，而且清得完。清不完的話這個事件就不是「處理麻煩」
  # 而是「這一輪你別想蓋東西了」，那太重了。
  #
  # 原版蠹蟲有鑽進石頭裡的行為，但那條 goal 在牠有目標時不會執行，而且要 mobGriefing 開著。
  # 牠們一生出來就會盯上玩家，所以實務上很少發生；真的鑽進去也只是少一隻。
  vermin:
    name: 蠹蟲
    entity: minecraft:silverfish
    health: 30
    attack_damage: 2
    movement_speed: 0.3
    scale: 1.0
    pack_min: 5
    pack_max: 8
    # 0 = 不進一般抽籤，只由突發事件叫出來
    weight: 0
    reward: 35

  boss:
    name: 巨獸
    entity: minecraft:sniffer
    health: 450
    attack_damage: 8
    movement_speed: 0.3
    scale: 1.6
    pack_min: 1
    pack_max: 1
    # 0 = 不進一般抽籤，只由突發事件叫出來
    weight: 0
    # 對應網頁版終界怪物的順移移動、吃小怪長大、殘血狂暴
    reward: 520
    skills: [瞬移突進, 召喚蟲群, 垂死狂暴]
