# 要塞對戰 — 怪物
#
# 不註冊新的實體型別，而是拿一個原版實體當底（entity）再套上這裡的數值，
# 所以加一種怪不用寫任何 Java，客戶端也不用裝 mod。
# 血量沿用網頁版的 MONSTER_KINDS，賞金那一欄拿掉了（MC 版沒有經濟系統）。
#
# 欄位
#   name           顯示名稱（會掛成實體的自訂名字）
#   entity         拿哪個原版實體當底
#   entities       多寫幾種的話，**每一隻各自隨機抽一種**（混合族群）。跟 entity 二擇一，
#                  兩個都寫時 entities 優先。數值仍然整群共用——混的是外觀與原版行為，不是強度
#                  兩種寫法：
#                    entities: [minecraft:rabbit, minecraft:fox]   等機率
#                    entities:                                     指定權重（數字越大越常出現）
#                      minecraft:rabbit: 6
#                      minecraft:fox: 1
#   health         血量上限
#   attack_damage  攻擊力。只有真的會攻擊的實體吃得到——被動生物永遠用不到，中立生物
#                  只有在你先打了牠之後才用得到
#   movement_speed 移動速度（原版殭屍約 0.23）
#   scale          體型倍率
#   pack_min/max   一次降臨幾隻
#   weight         抽籤權重，0 = 只能被突發事件指名叫出來
#   skills         掛在牠身上的技能 id（定義在 skills.yml）
#
# 為什麼中場的怪不能是敵對生物：
#   怪物生在中場，賞金是唯一的競爭性收入。用會追人的敵對生物的話，牠們會走向其中一名玩家，
#   那一側就變得比較好打——誰拿到賞金變成「怪剛好往誰那邊走」決定的，而不是誰瞄得準。
#   （玩家本來就進不去中場，見 duel.yml 的 arena.neutral_fraction）
#
#   被動與中立都可以，敵對不行。中立生物（蜜蜂、狐狸、北極熊）平常不理人，只有你打了牠
#   才會追過來——那是你自己選的，跟「它剛好生在誰旁邊」不一樣。敵對生物則是一生出來就
#   往人走，那一側立刻比較好打，跟誰瞄得準無關。
#
#   注意 duel.yml 的 arena.creatures_roam_freely 預設是 true，也就是**怪追得到玩家**
#   （之前三區塊限制會把牠們擋在中場）。所以上面那條「敵對不行」現在是唯一的防線了。
#
#   唯一的例外是 vermin（蠹蟲），牠是給鼠疫事件用的，刻意生在雙方自己的陣地裡。
#
# 賞金的定價原則：**每一點血值 1.1~1.4 元**，整群的總賞金落在 $270~$700。
#
#   野獸群   28 × 8~12 = $224~336   （每點血 1.40：混合族群，個體大小差很多、難統一瞄）
#   野牛群  140 × 4~6  = $560~840   （1.08）
#   蝙蝠群   90 × 2~4  = $180~360   （1.29：會飛，也難瞄）
#   漂鳥     160 × 3~5 = $480~800   （1.23）
#   難民     70 × 5    = $350       （1.27）
#   悅靈    140 × 3~5  = $420~700   （0.64——唯一打折的，理由見下面它自己的註解）
#   巨獸    520 × 1    = $520       （1.16，權重 0，只有 ender 事件叫得出來）
#
# 為什麼要拉近：舊值的流浪商隊整群 $1000、隱藏副本只有 $250，差四倍，而抽到哪個事件
# 純粹是運氣。事件每 120 秒一次剛好一輪，對照每輪固定收入 $380——一次抽籤就決定誰多拿了
# 兩輪的錢，那不是玩家能操作的東西。拉近之後最大最小差 2.6 倍。
#
# 彈藥成本相對賞金可以忽略（廢鐵彈打一隻漂鳥 7 發 $7，拿 $160），所以打怪的成本
# 從來不是錢，是時間與暴露——你在中場的那段時間，對手正在拆你的牆。
#
# 尚未實作：怪物還沒有「主動去打核心」的 AI，牠們走的是原版的目標選擇。
# 等那個做出來才會有對應的設定欄位——現在沒有欄位，就是真的沒有這個行為。

mobs:
  # 混合族群：每一隻各自從 entities 依權重抽一種原版實體當底，所以一群裡兔子、穿山甲、
  # 狐狸、駱駝、北極熊都有。數值（血量、攻擊、體型）仍然整群共用——這裡混的是外觀與
  # 原版行為，不是強度。
  #
  # 權重不是等的，因為混進來的原版行為不對等：
  #
  #   狐狸會獵捕兔子（Fox 的 NearestAttackableTargetGoal 吃 Animal）。等權重時一群裡
  #   會有兩三隻狐狸，兔子被吃到剩不下幾隻——玩家還沒瞄準賞金就自己蒸發了。壓到 1/14
  #   之後牠變成偶爾出現的點綴：看得到牠追兔子，但那是風景不是損失。
  #
  #   北極熊被打會還手、身邊有幼熊時會主動攻擊玩家，而 creatures_roam_freely 開著時牠
  #   真的追得到你（8 攻擊力對 20 血的玩家很有感）。所以也不要太多。
  #
  # 兔子 6 / 穿山甲 3 / 駱駝 2 / 北極熊 2 / 狐狸 1，總和 14——
  # 一群 8~12 隻裡大約 4~5 隻兔子、0~1 隻狐狸
  swarm:
    name: 野獸群
    entities:
      minecraft:rabbit: 6
      minecraft:armadillo: 3
      minecraft:camel: 2
      minecraft:polar_bear: 2
      minecraft:fox: 1
    health: 20
    attack_damage: 2
    movement_speed: 0.3
    scale: 1.0
    pack_min: 8
    pack_max: 12
    weight: 3.0
    reward: 28
    skills: [分身]

  ground:
    name: 野牛群
    entity: minecraft:cow
    health: 130
    attack_damage: 4
    movement_speed: 0.18
    scale: 1.2
    pack_min: 4
    pack_max: 6
    weight: 3.0
    reward: 140
    skills: [垂死分裂]

  sky:
    name: 蝙蝠群
    entity: minecraft:bat
    health: 70
    attack_damage: 3
    movement_speed: 0.4
    scale: 1.0
    pack_min: 2
    pack_max: 4
    weight: 2.0
    reward: 90

  # 蜜蜂是**中立**的：被打會反擊並且螫人（螫完自己也會死）。這跟這份檔案原本「只選完全
  # 被動」的規則相反，而且 creatures_roam_freely 開著時牠真的追得過來——所以「打不打牠」
  # 變成一個要想一下的決定，而不是白拿的賞金。這是刻意的。
  #
  # 體型 1.5 倍：蜜蜂的原版碰撞箱很小，不放大的話這一群的難度不是「飛得飄」而是「看不到」
  drift:
    name: 漂鳥
    entity: minecraft:bee
    health: 130
    attack_damage: 3
    movement_speed: 0.45
    scale: 1.5
    pack_min: 3
    pack_max: 5
    weight: 2.0
    reward: 160
    skills: [閃現]

  refugee:
    name: 難民
    entity: minecraft:villager
    health: 55
    attack_damage: 5
    movement_speed: 0.35
    scale: 1.0
    pack_min: 5
    pack_max: 5
    weight: 1.0
    reward: 70

  # 它對人沒興趣，但會把**玩家蓋的方塊**一格一格啃掉（skills 的「啃食」）。天然地形與
  # 框線不動——只吃跟開場前不一樣的格子，所以它咬的一定是有人蓋上去的東西。
  #
  # 3~5 隻而不是 1~2：一隻每分鐘啃 60 格，那只是背景噪音；四隻同時圍著一面牆才會逼你
  # 停下手上的事去處理。
  #
  # 血量 220 是全場第二厚（僅次於巨獸的 450），刻意的：它要能撐到真的啃出一個洞。
  # 血薄的話玩家一看到就順手清掉，那個「破壞慾」永遠不會發生，這隻怪等於只是移動靶。
  # 參考：廢鐵彈 11 發、機槍 19 發、狙擊 5 發打死一隻。
  #
  # 賞金因此脫離「每點血 1.1~1.4」那條線（220 血只給 140，等於 0.64）。這是唯一
  # 一個該打折的怪：**殺它本身就有回報**——它不死你的牆會一直少。其他怪不打就只是
  # 少賺，這隻不打是實際損失，所以不需要再用賞金去獎勵你動手。
  #
  # 會飛（悅靈）是刻意的：牆的上緣、屋頂、懸空的結構都躲不掉，所以「蓋高一點」不是解法。
  eclipse:
    name: 悅靈
    entity: minecraft:allay
    health: 220
    attack_damage: 6
    movement_speed: 0.5
    scale: 1.4
    pack_min: 3
    pack_max: 5
    weight: 1.0
    reward: 140
    skills: [閃現, 再生, 啃食]

  # 鼠疫事件專用，是這份檔案裡**唯一敵對**的一種。
  #
  # 其餘的怪生在中場，是雙方要搶的收入；這種生在雙方自己的熊貓圈旁邊、會主動咬玩家，
  # 是你家裡的麻煩。兩邊同時放所以起點是對稱的——但 creatures_roam_freely 開著時牠們會
  # 追著人跑，所以真的會有幾隻晃到對面去，那是可以接受的浮動。
  #
  # 血量壓低（30）是刻意的：它要能被清掉，而且清得完。清不完的話這個事件就不是「處理麻煩」
  # 而是「這一輪你別想蓋東西了」，那太重了。
  #
  # 原版蠹蟲有鑽進石頭裡的行為，但那條 goal 在牠有目標時不會執行，而且要 mobGriefing 開著。
  # 牠們一生出來就會盯上玩家，所以實務上很少發生；真的鑽進去也只是少一隻。
  vermin:
    name: 蠹蟲
    entity: minecraft:silverfish
    health: 30
    attack_damage: 2
    movement_speed: 0.3
    scale: 1.0
    pack_min: 5
    pack_max: 8
    # 0 = 不進一般抽籤，只由突發事件叫出來
    weight: 0
    reward: 35

  boss:
    name: 巨獸
    entity: minecraft:sniffer
    health: 450
    attack_damage: 8
    movement_speed: 0.3
    scale: 1.6
    pack_min: 1
    pack_max: 1
    # 0 = 不進一般抽籤，只由突發事件叫出來
    weight: 0
    # 對應網頁版終界怪物的順移移動、吃小怪長大、殘血狂暴
    reward: 520
    skills: [瞬移突進, 召喚蟲群, 垂死狂暴]
