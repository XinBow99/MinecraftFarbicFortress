# 要塞對戰 — 彈藥材料
#
# 玩家買材料、自己組合出彈藥。每一種材料只負責**一條軸**，所以沒有「最強的材料」——
# 想要某一項強就得把錢花在它上面，而錢花在這裡就沒花在別的地方。
#
# ── 組合怎麼算 ────────────────────────────────────────────────────────
#
# 每一疊東西身上都記著一個**材料向量**：這裡面總共embodied了幾個哪種材料。
#
#     v = { powder: 12, propellant: 3, fins: 0, guidance: 5, shot: 2, charge: 0 }
#
# **組合就是向量相加。** 材料貢獻自己那一軸的 1；已經做好的彈藥貢獻它記著的整個向量
# ——所以「把成品丟回去再組」是免費得到的，不需要另外做一套規則。
#
# ── 為什麼堆同一種不會變成最優解 ──────────────────────────────────────
#
# 每一軸都吃**邊際遞減**（下面每個屬性的 exponent，預設 0.6），但價格是線性的：
#
#     投入 1 個   傷害 12    花 1 份錢
#     投入 9 個   傷害 34    花 9 份錢
#     投入 27 個  傷害 62    花 27 份錢
#
# 九倍的材料只換到不到三倍的傷害，所以**專精在金錢上永遠是虧的**。攤開來點才划算，
# 而「我就是要一發超重的」變成一個奢侈品，不是最優解。
#
# 這條性質是結構性的，不是靠數值調出來的：無論之後怎麼改基準值，n^0.6 對上 n 的
# 差距都在。遞迴組合也因此安全——套幾層都追不上價格。
#
# ── 沒投入的軸給什麼 ──────────────────────────────────────────────────
#
# 給一個**很差但能用**的基準（下面每個屬性的 base），不是 0。
# 0 的話「速度 0 的彈丸」根本射不出去，等於強迫每一軸都要投入，自由度反而變低。
#
# 基準值刻意訂在「勉強打得中十格內的靜止目標」：慢、飄、散，但看得到它飛出去。
# 所以純專精做出來的是一把**有明顯短板的特化槍**，不是廢鐵。
#
# ── 兩條軸是反過來的 ──────────────────────────────────────────────────
#
# 重力與散佈是「越低越好」，所以它們的材料是**減少**那個值的（見 direction: down）。
# 這樣每一種材料就都是「往好的方向推」，玩家不用記哪個是反的。
#
# 順帶一提這也是霰彈的做法：**不投入精度**就會散開。不需要另外做一種「增加散佈」的材料
# ——散是預設狀態，準才要花錢。
#
# ── 欄位 ──────────────────────────────────────────────────────────────
#
# attributes（每一條軸怎麼從投入數換成數值）
#   base       投入 0 個時的值（那個「很差的基準」）
#   unit       曲線的係數
#   exponent   邊際遞減的指數。0.6 = 九倍投入換三.六倍效果；1.0 = 線性（不建議）
#   direction  up   = base + unit × n^exp        （越多越大：傷害、速度、顆數、爆炸）
#              down = floor + (base-floor) ÷ (1 + unit × n^exp)  （越多越小：重力、散佈）
#   floor      direction: down 時的下限，永遠到不了但會逼近
#   max        上限，留空 = 不限。顆數與爆炸半徑要有上限，那是效能不是平衡
#   round      true = 取整數（顆數用）
#
# materials（買得到的東西）
#   name       顯示名稱
#   item       商店給的原版物品（也就是玩家在工作台上擺的東西）。
#              **不能跟 weapons.yml 任何一把武器的 item 撞號**——撞到的話那疊材料放進副手
#              會被當成那把武器射出去（byAmmoStack 查不到向量就退回物品 id 那張表），
#              反過來預設彈藥擺進工作台也會被讀成材料。目前十把武器用掉的是：
#              iron_nugget、copper_ingot、iron_ingot、flint、blaze_rod、tnt、
#              amethyst_shard、firework_rocket、turtle_egg、ender_eye
#              （撞號會在開機時警告，見 ConfigManager.checkMaterialItems）
#
#              另外要挑**右鍵沒有原版行為**的物品：火焰彈會點火、紅石與地獄疣會被放下來，
#              那些在對戰場地裡都是意外。目前七種都是純惰性的物品
#   attribute  它推哪一條軸
#   price      單價。商店的材料條目由程式從這裡生成，不用手寫進 shops.yml

# 軍火商的量產。工作台只做出「一份設計」，數量永遠是用錢買的。
#
# 為什麼要分開：產出一疊的話會變成無限複製（見 CraftingBench）。分開之後還有一個好處——
# **設計的成本與彈藥的成本是兩件事**：研發一次要花材料，之後每一發只要錢。
production:
  # 每一發的價格 = 這份設計用掉的材料數 × 這個係數。
  #
  # 線性是刻意的，而數值是 n^0.6：九倍的材料換不到三倍的效果卻要付九倍的錢，
  # 所以「專精」在量產階段依然是虧的，跟工作台那一端的結論一致。
  #
  # 1.5 的定位：9 個材料的設計 ≈ $13.5 一發，跟狙擊彈（$13.75）同一個量級；
  # 3 個材料的入門設計 $4.5，比散彈稍貴；27 個材料的怪物 $40.5 一發
  price_per_material: 1.5
  # 買一次給幾發
  batch: 16

attributes:
  # 單發傷害。基準 4 ＝ 打三發才破一格木頭（木頭 30 血），可用但難用
  damage:
    base: 4.0
    unit: 8.0
    exponent: 0.6
    direction: up

  # 彈丸初速（格/tick）。基準 1.6 慢到看得清楚，但配上基準重力射程只有 28 格
  speed:
    base: 1.6
    unit: 0.5
    exponent: 0.6
    direction: up
    max: 8.0

  # 重力（格/tick²）。越小越平、射得越遠。
  # 45 度最大射程 ≈ 速度² ÷ 重力，所以這兩軸是一起決定射程的——
  # 只堆速度不堆彈道的話，那發子彈會很快地掉下去
  guidance:
    base: 0.09
    unit: 0.6
    exponent: 0.6
    direction: down
    floor: 0.008

  # 散佈半頂角（度）。越小越準。
  # 基準 8 度在 30 格外偏 4 格——打得到牆，打不到人
  precision:
    base: 8.0
    unit: 1.0
    exponent: 0.6
    direction: down
    floor: 0.2

  # 一發打出幾顆。上限 12 是效能考量：每一顆都是獨立的彈丸與粒子軌跡
  pellets:
    base: 1.0
    unit: 1.2
    exponent: 0.6
    direction: up
    max: 12.0
    round: true

  # 濺射半徑（格）。上限 5 也是效能：半徑 5 的球體要掃 1331 格
  splash:
    base: 0.0
    unit: 0.5
    exponent: 0.6
    direction: up
    max: 5.0

  # 裝填間隔（tick）。越小射得越快。
  #
  # 這條軸跟其他六條有兩個地方不一樣：
  #
  # 1. **base 寫什麼都沒用**——它是從「這一發有多重」推出來的（火力越高裝填越久），
  #    投入的材料只是把那個推導值往下壓。寫在這裡只是讓欄位齊整。
  #
  #    不能讓它變成一條獨立的軸：傷害 × 射速 = DPS 是**相乘**的，兩條 n^0.6 相乘就是
  #    n^1.2，而價格是線性的 n——「傷害與射速對半下注」會變成報酬超線性的組合，
  #    整套平衡的地基（專精與堆疊在金錢上永遠是虧的）就沒了。接在推導值後面相除的話，
  #    火力剛好抵銷掉，DPS 只剩這條軸自己的 n^0.6。
  #
  #    所以傷害買的是**單發的穿透力**（幾發破一面牆、能不能一發帶走），射速買的才是
  #    持續輸出——分開之後兩條軸才真的在賣不同的東西。
  #
  # 2. **投入 0 個與 1 個是質變**：投了就是連射武器（按住右鍵一直打），沒投就是拉弓
  #    放開的單發。而連射不吃蓄力，所以買連發等於**放棄用力道控制初速**——
  #    想拋高球越過牆的設計不該碰這條。
  #
  # floor 2 是硬底：雷射（cooldown 2）是這個遊戲最快的武器，自製設計逼近但到不了。
  cadence:
    base: 0.0
    unit: 0.5
    exponent: 0.6
    direction: down
    floor: 2.0

materials:
  powder:
    name: 火藥
    item: minecraft:gunpowder
    attribute: damage
    price: 12

  propellant:
    name: 推進劑
    item: minecraft:blaze_powder
    attribute: speed
    price: 12

  guidance:
    name: 導引翼
    item: minecraft:feather
    attribute: guidance
    price: 12

  precision:
    name: 校準環
    item: minecraft:quartz
    attribute: precision
    price: 12

  shot:
    name: 霰粒
    item: minecraft:gold_nugget
    attribute: pellets
    price: 12

  charge:
    name: 炸藥
    item: minecraft:magma_cream
    attribute: splash
    price: 12

  # 唯一一種「有沒有買」本身就改變操作方式的材料，所以定價比其他六種高一截：
  # 第一個買的不只是快一點，是把這把槍從拉弓改成按住不放
  cadence:
    name: 連發機構
    item: minecraft:sugar
    attribute: cadence
    price: 18
