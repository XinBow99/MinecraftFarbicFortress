# 要塞對戰 — 建築
#
# 開場時兩側各蓋一份（要蓋哪幾棟在 duel.yml 的 arena.buildings）。
# 南半場會整個沿 Z 鏡射，所以兩邊的店都開口朝向中場，不會一邊背對。
#
# 藍圖寫法：調色盤 + 逐層字元圖
#   offset      相對自己核心的位置（南半場的 z 會自動變號）
#   palette     一個字元對一個方塊。**字元不在調色盤裡 = 那一格不要動**（地形會穿過去）
#               可以帶方塊狀態：minecraft:wheat[age=7] = 成熟的麥子。不寫就是預設狀態，
#               而預設狀態不見得是你要的——小麥的預設是剛發芽的秧苗
#   layers      由下往上，一層一個 y；一層裡一列一個 z（北→南），一列裡一個字元一個 x（西→東）
#   npc         要放在裡面的 NPC id（對應 npcs.yml）
#   npc_offset  NPC 相對建築原點（也就是 offset 那一格）的位置
#   sold        true = 建築師巴布會賣這張圖紙。offset 對圖紙沒有意義（玩家自己選點，
#               程式會把 offset 抵消掉），所以標了 sold 的藍圖不用寫 offset
#
# 對戰結束時整棟會跟著競技場一起還原，NPC 也會被移除。

buildings:
  weapon_shop:
    name: 武器商店
    # 蓋在核心後方（遠離中場那一側），玩家補彈藥時不會直接暴露在對手火線上
    offset: {x: -3, y: 0, z: 4}

    palette:
      S: minecraft:stone_bricks
      C: minecraft:chiseled_stone_bricks
      G: minecraft:glass_pane
      L: minecraft:lantern
      P: minecraft:oak_planks
      ".": minecraft:air

    layers:
      # y = 0：地板
      - ["PPPPPPP",
         "PPPPPPP",
         "PPPPPPP",
         "PPPPPPP",
         "PPPPPPP"]
      # y = 1：牆，南面（朝中場那側）開一個三格寬的門
      - ["SSSSSSS",
         "S.....S",
         "S.....S",
         "S.....S",
         "SS...SS"]
      # y = 2：牆 + 窗
      - ["SGSGSGS",
         "G.....G",
         "S.....S",
         "G.....G",
         "SS...SS"]
      # y = 3：牆頂
      - ["SSSSSSS",
         "S.....S",
         "S..L..S",
         "S.....S",
         "SSSSSSS"]
      # y = 4：屋頂
      - ["CCCCCCC",
         "CCCCCCC",
         "CCCCCCC",
         "CCCCCCC",
         "CCCCCCC"]

    npc: arms_dealer
    # 站在店的正中央、地板上方一格
    npc_offset: {x: 3, y: 1, z: 2}

  # ---- 工人的節點 ----
  #
  # 這兩張不列在 duel.yml 的 arena.buildings 裡——它們不是開場蓋的，而是每一輪由工人系統
  # 隨機擺在玩家陣地裡（哪一種、幾個、離熊貓圈多遠在 jobs.yml）。
  #
  # **offset 必須是 0**：節點的位置是現場抽出來的，不像商店那樣相對核心擺。
  # （寫了也不會壞——擺放時會把它抵消掉——但那只會讓設定檔看起來在說謊）
  #
  # 藍圖的第 0 層會**取代地表那一格**，第 1 層以上長在地面上。所以第 0 層放底座
  # （耕地、石頭），可以採的東西放第 1 層。
  #
  # 兩張都剛好 8 格可採，那個數字是配著 jobs.yml 的產出速率算的：一個工人一輪大概
  # 就採得完一個節點，而每一輪只補一個——供給正好卡住產能，對手炸掉一個才是真的損失。

  ore_vein:
    name: 礦脈
    offset: {x: 0, y: 0, z: 0}

    palette:
      S: minecraft:stone
      C: minecraft:cinnabar
      U: minecraft:sulfur

    layers:
      # y = 0：底座，取代地表那一格
      - ["SSS",
         "SSS",
         "SSS"]
      # y = 1：8 格礦，中間留一塊石頭當視覺的錨
      - ["CUC",
         "USU",
         "CUC"]

  rice_paddy:
    name: 稻田
    offset: {x: 0, y: 0, z: 0}

    palette:
      D: minecraft:farmland
      "~": minecraft:water
      # 一定要寫 age=7，不然種下去是一片剛發芽的秧苗，看起來像沒種成功
      "#": minecraft:wheat[age=7]
      ".": minecraft:air

    layers:
      # y = 0：正中央一格水源，八格耕地全部貼著它，所以永遠是濕的（乾掉會變回泥土、
      # 連帶把上面的麥子弄掉）
      - ["DDD",
         "D~D",
         "DDD"]
      # y = 1：8 株成熟的麥子，水源上方留空
      - ["###",
         "#.#",
         "###"]

  # ---- 建築師巴布賣的圖紙（sold: true）----
  #
  # 這兩棟是**給玩家省時間的**，不是新的戰術。同樣的錢自己一格一格擺也蓋得出來，圖紙省掉
  # 的是那三分鐘——而那三分鐘裡場上什麼都沒有發生，那正是這個遊戲最無聊的一段。
  #
  # 價格不寫在這裡：照下面每一格的建材單價加總再打八折算出來（見 BlueprintShop）。
  # 所以改一層樓高度、換一種材質，價格會自己跟著動。

  # 10 寬 × 6 高的一片鐵牆。一格厚——它是掩體不是堡壘，繞得過去。
  # 鐵塊 $5 一格 × 60 格 = $300，打八折 $240
  iron_wall:
    name: 反移民圍牆
    sold: true
    palette:
      I: minecraft:iron_block
    layers:
      - ["IIIIIIIIII"]
      - ["IIIIIIIIII"]
      - ["IIIIIIIIII"]
      - ["IIIIIIIIII"]
      - ["IIIIIIIIII"]
      - ["IIIIIIIIII"]

  # 20 格高的空心**圓**塔，外徑 7（半徑 3），裡面一路梯子爬到頂。
  #
  # 圓的而不是方的：轉角那幾格的斜階是 Minecraft 畫圓本來的樣子，玩家鑽不過去，而且從外面
  # 看它是一座塔而不是一根柱子。順帶少掉八格牆——方形一層要 24 格，圓形只要 16。
  #
  # 圓外那四個角用的是**調色盤裡沒有的字元（空白）**，意思是「這一格不要動」——所以它們
  # 不會被塞成空氣，原本的地形（樹、你自己蓋的牆）會直接穿過去。
  #
  # 底下兩層的南面正中留一格門進去。梯子貼著北牆（facing=south ＝ 梯面朝南、背靠北牆），
  # 從 y=0 一路長到頂，所以爬上去之後可以直接踩上塔緣。
  #
  # 石頭 $1.25 一格 x 318 格 = $398，打八折 = $318
  burj:
    name: 哈里發塔
    sold: true
    palette:
      S: minecraft:stone
      L: minecraft:ladder[facing=south]
      ".": minecraft:air
    layers:
      # y = 0
      - ["  SSS  ",
         " S.L.S ",
         "S.....S",
         "S.....S",
         "S.....S",
         " S...S ",
         "  S.S  "]
      # y = 1
      - ["  SSS  ",
         " S.L.S ",
         "S.....S",
         "S.....S",
         "S.....S",
         " S...S ",
         "  S.S  "]
      # y = 2
      - ["  SSS  ",
         " S.L.S ",
         "S.....S",
         "S.....S",
         "S.....S",
         " S...S ",
         "  SSS  "]
      # y = 3
