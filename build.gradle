plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// SnakeYAML（怪物／武器／突發事件的設定檔格式）從 Maven Central 取得
	mavenCentral()
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fortress-duel" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// client 與 server 各自一個資料夾。共用同一個 run/ 的話兩邊會互相蓋掉 logs/latest.log，
		// 出問題時看到的往往是另一邊的 log
		client {
			runDir = "run/client"
			// 固定使用者名稱：對戰指令要打對方的名字，每次啟動都隨機取名很難用
			programArgs "--username", "Alpha"
		}

		// 第二個 client。要測對戰至少要兩個玩家，所以直接內建一個
		clientTwo {
			client()
			configName = "Minecraft Client 2"
			source sourceSets.client
			runDir = "run/client2"
			programArgs "--username", "Bravo"
		}

		server {
			runDir = "run/server"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// YAML 設定檔。include ＝ 打包進 jar（jar-in-jar），玩家不需要另外裝
	include implementation("org.yaml:snakeyaml:2.4")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

/**
 * sounds.json 是掃出來的，不是手寫的。
 *
 * 加一首歌應該只要「把 ogg 丟進 sounds/ 資料夾、在 songs.yml 寫個名字」——手寫一份宣告檔
 * 的話一定會有人漏掉，而漏掉的症狀是「遊戲裡安靜，沒有任何錯誤訊息」，最難查的那種。
 */
def generatedResources = layout.buildDirectory.dir('generated/resources')
def soundsDir = file('src/main/resources/assets/fortress-duel/sounds')

tasks.register('generateSoundsJson') {
	group = 'build'
	description = '掃 assets/fortress-duel/sounds/*.ogg 產生 sounds.json'

	inputs.dir soundsDir
	def outFile = generatedResources.map { it.file('assets/fortress-duel/sounds.json') }
	outputs.file outFile

	doLast {
		def names = soundsDir.listFiles()
				.findAll { it.name.endsWith('.ogg') }
				.collect { it.name - '.ogg' }
				.sort()

		def bad = names.findAll { !(it ==~ /[a-z0-9_.-]+/) }
		if (bad) {
			// 音效 id 只吃小寫英數與 _ . -，中文檔名在遊戲裡會直接找不到而且不會報錯
			throw new GradleException("這些音檔的檔名不能當音效 id（只能用小寫英數與 _ . -）：${bad}")
		}

		def json = new StringBuilder('{\n')
		names.eachWithIndex { name, i ->
			json << """  "${name}": {
    "category": "record",
    "sounds": [
      { "name": "fortress-duel:${name}", "stream": true }
    ]
  }${i < names.size() - 1 ? ',' : ''}\n"""
		}
		json << '}\n'

		def target = outFile.get().asFile
		target.parentFile.mkdirs()
		target.text = json.toString()
		logger.lifecycle("sounds.json：${names.size()} 首（${names.join(', ')}）")
	}
}

sourceSets.main.resources.srcDir(generatedResources)
// 產生的檔案在 main 的 resources 裡，所以每個會讀那份 resources 的任務都要等它先跑完
tasks.named('processResources') { dependsOn 'generateSoundsJson' }
tasks.named('sourcesJar') { dependsOn 'generateSoundsJson' }

/**
 * 伺服器資源包：把模組 assets 裡的音效打包成一個 zip，讓**沒裝模組的客戶端**也聽得到。
 *
 * 玩家不用手動裝——伺服器在 server.properties 填這個 zip 的網址，進來時原版就會問
 * 「是否下載伺服器資源包」，同意之後自動套用。
 *
 * 音檔不另外複製一份：資料來源就是模組自己的 assets，兩邊永遠是同一個檔案。
 * 跑 `./gradlew resourcePack` 會印出 server.properties 要填的 sha1。
 */
tasks.register('resourcePack', Zip) {
	group = 'build'
	description = '打包成伺服器資源包（server.properties 的 resource-pack）'

	archiveFileName = "fortress-duel-resources-${project.version}.zip"
	destinationDirectory = layout.buildDirectory.dir('resourcepack')

	dependsOn 'generateSoundsJson'

	from('resourcepack') // pack.mcmeta
	from('src/main/resources/assets') {
		into 'assets'
		exclude 'fortress-duel/icon.png' // 模組清單用的圖示，資源包裡沒有意義
	}
	from(generatedResources) // 掃出來的 sounds.json

	doLast {
		def zip = archiveFile.get().asFile
		def sha1 = java.security.MessageDigest.getInstance('SHA-1')
				.digest(zip.bytes).encodeHex().toString()
		logger.lifecycle("資源包：${zip}")
		logger.lifecycle("resource-pack-sha1=${sha1}")
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
